[package]
name = "north-star-measure"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measures North Star objectives O1, O3 and O5 from signed north-star-input.<Ox>.json release assets"
license = "Apache-2.0"

# Standalone: not part of any parent workspace.
[workspace]

[dependencies]
# preserve_order: the output keeps the key order of O2.json and O4.json.
serde_json = { version = "1", features = ["preserve_order"] }
# 0.8 parses TOML 1.0, the spec scripts/check-north-star.py (tomllib) reads.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The SHA256SUMS line for the input is checked here; the signature over
# SHA256SUMS is cosign's job.
sha2 = "0.10"
# No HTTP crate: GitHub is REST over curl, as in scripts/north-star-o2.py.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
