base_url = "https://pulseengine.eu"
title = "PulseEngine"
description = "A WebAssembly Component Model engine for safety-critical systems, with formally verified components. Static fusion, translation-validated optimization, and supply-chain attestation in Rust."
default_language = "en"
compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
minify_html = true

[link_checker]
# GitHub-rendered markdown anchors and ACM bot-blocking cause false positives
skip_anchor_prefixes = [
    "https://github.com/",
]
skip_prefixes = [
    "https://dl.acm.org/",
    # Both return 403 to every non-browser client, browser User-Agent included;
    # verified by hand 2026-10-15. The pages are live for a human reader, so there
    # is no automated check that can pass and nothing to fix in the link itself.
    "https://www.mdpi.com/",
    "https://militaryembedded.com/",
]

[markdown]
smart_punctuation = true
bottom_footnotes = true

[markdown.highlighting]
theme = "material-theme-ocean"

[extra]
author = "PulseEngine"

[[taxonomies]]
name = "tags"
feed = true

[[taxonomies]]
name = "authors"
feed = true
