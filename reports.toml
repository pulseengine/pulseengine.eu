# Report sources. `fetch-reports` reads this during the deploy and writes
# static/reports/index.json; templates/reports.html reads BOTH, taking the
# version list from the index and the entry path from here.
#
# `entry` is the file inside a version directory that a reader should land on.
# It is not uniform: witness ships an HTML suite, scry ships plain text and no
# HTML at all, so a single hardcoded path made every scry link on the reports
# page a 404. Default when absent: "compliance/".
# reports.toml — projects that publish rivet compliance reports
#
# Each project entry declares:
#   repo           = "owner/repo" on GitHub
#   asset_pattern  = naming convention for the compliance tarball
#                    {name} = project key, {version} = tag without 'v' prefix
#   exclude        = glob patterns matched against tag names to skip

[projects.rivet]
repo = "pulseengine/rivet"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.spar]
repo = "pulseengine/spar"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.meld]
repo = "pulseengine/meld"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.loom]
repo = "pulseengine/loom"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.synth]
repo = "pulseengine/synth"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.sigil]
repo = "pulseengine/sigil"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.gale]
repo = "pulseengine/gale"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.wohl]
repo = "pulseengine/wohl"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

# relay intentionally omitted: it tags releases `falcon-v*`, which the
# semver-based fetcher and the {name}-v{version} asset pattern don't match.
# Supporting it needs a per-project tag prefix — tracked separately.

# ── MC/DC coverage reports (witness) ──────────────────────────────────
# kind = "mcdc" fetches a witness MC/DC evidence bundle and serves its own
# self-contained suite-index.html viewer (no rivet config.js). Projects with
# no published bundle yet are simply skipped until they ship one.
#
#   kind          = "mcdc"
#   asset_pattern = witness evidence tarball name on the repo's releases

[projects.witness]
repo = "pulseengine/witness"
kind = "mcdc"
asset_pattern = "{name}-v{version}-compliance-evidence.tar.gz"
entry = "mcdc/verdict-evidence/suite-index.html"
exclude = ["*-rc*", "*-alpha*"]

[projects.scry]
repo = "pulseengine/scry"
kind = "mcdc"
asset_pattern = "{name}-v{version}-mcdc-evidence.tar.gz"
entry = "mcdc/coverage-report.txt"
exclude = ["*-rc*", "*-alpha*"]
