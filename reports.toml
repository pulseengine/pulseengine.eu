# reports.toml — projects that publish rivet compliance reports
#
# Each project entry declares:
#   repo           = "owner/repo" on GitHub
#   asset_pattern  = naming convention for the compliance tarball
#                    {name} = project key, {version} = tag without 'v' prefix
#   exclude        = glob patterns matched against tag names to skip

[projects.rivet]
repo = "pulseengine/rivet"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.spar]
repo = "pulseengine/spar"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.meld]
repo = "pulseengine/meld"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.loom]
repo = "pulseengine/loom"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.synth]
repo = "pulseengine/synth"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.sigil]
repo = "pulseengine/sigil"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.gale]
repo = "pulseengine/gale"
asset_pattern = "{name}-v{version}-compliance-report.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

# ── MC/DC coverage reports (witness) ──────────────────────────────────
# kind = "mcdc" fetches a witness MC/DC evidence bundle and serves its own
# self-contained suite-index.html viewer (no rivet config.js). Projects with
# no published bundle yet are simply skipped until they ship one.
#
#   kind          = "mcdc"
#   asset_pattern = witness evidence tarball name on the repo's releases

[projects.witness]
repo = "pulseengine/witness"
kind = "mcdc"
asset_pattern = "{name}-v{version}-compliance-evidence.tar.gz"
exclude = ["*-rc*", "*-alpha*"]

[projects.scry]
repo = "pulseengine/scry"
kind = "mcdc"
asset_pattern = "{name}-v{version}-mcdc-evidence.tar.gz"
exclude = ["*-rc*", "*-alpha*"]
