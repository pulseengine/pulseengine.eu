# Planted control for the lockfile audit (not a real lockfile). The name must
# not end in Cargo.lock, or the audit picks it up. tar 0.4.44 carries
# RUSTSEC-2026-0067/0068, so `cargo audit` on this file must exit non-zero.
version = 4

[[package]]
name = "control"
version = "0.0.0"
dependencies = ["tar"]

[[package]]
name = "tar"
version = "0.4.44"
source = "registry+https://github.com/rust-lang/crates.io-index"
