# Scope for 0.35.0 — the three site features chosen on 2026-10-02.
#
# Everything here is `draft`: committed to the release, not started. The
# acceptance criteria are written as things a gate or a command can decide,
# because a criterion nobody can check is how a feature reaches `implemented`
# without being verifiable.
#
# Burn-down: `rivet release status 0.35.0`

artifacts:
  # ── #201: the hero as evidence ─────────────────────────────────────────
  - id: REQ-HERO-EVIDENCE
    type: requirement
    title: The landing page states current verification evidence, not a claim about it
    description: >-
      pulseengine.eu#201 argues the hero should hold a bounded live artifact
      that is evidence rather than decoration. The figures exist on /layers and
      come from a deploy-refreshed source; the landing page still describes the
      project instead of showing its state.
    status: implemented
    category: functional
    priority: should

  - id: FEAT-HERO-EVIDENCE
    type: feature
    title: Evidence panel in the landing-page hero
    description: >-
      Option C from #201, cut to three tiles by the owner: site claims holding
      (claim-check), the current varve layer and its digest (layers.json), and
      this repo's requirements with a verifying test (rivet coverage). gale's
      trusted-base count is deferred until gale emits it machine-readably.
      scripts/build-evidence.py measures all three at deploy into
      data/evidence.json; the template only renders it. A sparkline is drawn
      only where a real series exists.
    status: implemented
    phase: phase-1
    acceptance-criteria:
      - "Every figure in the hero is read from data/evidence.json, written at deploy by scripts/build-evidence.py; no figure is typed into the template (claim SITE-HERO-PANEL-NO-TYPED-FIGURES fails on any digit in the partial)."
      - "The layer tile and /layers read the same static/layers.json in the same build, so they cannot disagree."
      - "A tile whose source is older than seven days at build time renders greyed and says 'stale since <date>'; a source missing at build time renders 'unavailable', never a remembered number."
      - "A sparkline appears only for a tile with at least two real points: claims.yaml git history and the layer index. It is drawn as steps from real timestamps; nothing is interpolated or smoothed."
      - "check-asset-cachebust, check-internal-links and the existing gates stay green; the panel has no horizontal scroll at 390px."
    links:
      - type: satisfies
        target: REQ-HERO-EVIDENCE

  - id: VER-HERO-EVIDENCE
    type: verification
    title: build-evidence.py --self-test
    description: >-
      Decision table over the generator, offline: each missing or malformed
      source yields unavailable with no value; an empty rivet load is not 0/0;
      an eight-day-old layer snapshot falls past its stale_after; one point is
      not a sparkline. Red-first: widening the threshold to nine days fails the
      staleness case. The template half is gated by claim
      SITE-HERO-PANEL-NO-TYPED-FIGURES, seen to fail with a typed "18/18".
    status: verified
    method: automated-test
    test-location: scripts/build-evidence.py
    links:
      - type: verifies
        target: REQ-HERO-EVIDENCE

  # ── reports <-> layers ─────────────────────────────────────────────────
  - id: REQ-REPORT-CROSSLINK
    type: requirement
    title: A tool in a layer is linked to its verification evidence, or the gap is stated
    description: >-
      Measured 2026-10-01 against layer 2026.10.0 — of 16 tools, 4 have a report
      at the exact shipped version, 3 ship ahead of their newest report (synth
      0.78.0 against 0.43.0), and 9 have no report at all. A page that linked
      only where evidence exists would read as though the other 12 were fine.
    status: draft
    category: functional
    priority: should

  - id: FEAT-REPORT-CROSSLINK
    type: feature
    title: Link each layer payload to its report at that version
    description: >-
      Join layers.json to reports/index.json on tool name and version, honouring
      the project/binary aliases (wsc is sigil, kilnd is kiln), and render three
      distinct states rather than two.
    status: draft
    phase: phase-1
    acceptance-criteria:
      - "A tool whose exact shipped version has a report links to that version's report, not to latest."
      - "A tool shipping ahead of its newest report says so, with both versions, rather than linking the older one silently."
      - "A tool with no report says so; it is not omitted from the table."
      - "The join is computed at deploy time from the two JSON files; no mapping is hand-maintained in a template except the alias table, which is in one place."
      - "A gate fails if the alias table names a tool that is in neither file."
    links:
      - type: satisfies
        target: REQ-REPORT-CROSSLINK

  # ── install ────────────────────────────────────────────────────────────
  - id: REQ-LAYER-INSTALL
    type: requirement
    title: A reader can install the layer the page describes
    description: >-
      /layers says what a layer carries and how long it is supported, and gives
      a reader no way to obtain it. The registry coordinates are already on the
      page; the commands are not.
    status: draft
    category: functional
    priority: could

  - id: FEAT-LAYER-INSTALL
    type: feature
    title: Install and pin instructions on /layers
    description: >-
      The varve.toml stanza and the install command for the selected layer, with
      realm, channel and registry filled from the live data so they cannot go
      stale, plus how to verify what was installed.
    status: draft
    phase: phase-1
    acceptance-criteria:
      - "Realm, channel, registry and layer tag in the shown commands come from layers.json, not from prose."
      - "Switching realm or layer changes the commands to match the selection."
      - "Any command not executed against a real install is marked as transcribed from varve's documentation rather than shown as observed output."
      - "The composition case shows the effective support horizon, not covalent's stated one (varve#226)."
    links:
      - type: satisfies
        target: REQ-LAYER-INSTALL
