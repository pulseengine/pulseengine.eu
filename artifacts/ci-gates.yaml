  - id: REQ-HOOK-ZSH-SHELL-OPTIONS
    type: requirement
    title: SessionStart makes zsh stop failing agent Bash calls on unmatched globs and =word
    description: >-
      Owner-approved 2026-10-29 from a study of archived agent Bash calls: about 2,200 failed on zsh NOMATCH (an unmatched `--include=*.ext` glob, a `?` in an unquoted URL, `--format=%G?`) or EQUALS (`echo ===`, `[ "$a" == "$b" ]`), many with the status hidden by a pipe. A SessionStart hook in the plugin appends `if [ -n "$ZSH_VERSION" ]; then setopt no_nomatch no_equals; fi` to $CLAUDE_ENV_FILE, which Claude Code runs before every Bash command in the same shell. It is a no-op under bash and leaves exit status 0 (an `&&` form would leave 1 and fail anything chained after the file). It appends at most one copy however often SessionStart fires (startup, resume, clear, compact), never truncates the file, keeps another hook's unterminated last line intact, and exits 0 without writing when CLAUDE_ENV_FILE is unset. pipefail is measured and deliberately not set.
    status: verified
    release: 0.46.1
    category: functional
    priority: should
    fields:
      category: functional

