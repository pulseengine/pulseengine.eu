  - id: REQ-FACTORY-NOTICE-CURL-FALLBACK
    type: requirement
    title: notice.py retries a DNS or connection failure via curl, and only that
    description: >-
      Owner decision 2026-10-29. On macOS, Local Network privacy is per binary: python3 can fail to resolve a .local host (urllib URLError wrapping socket.gaierror "nodename nor servname provided") or to reach a LAN host (EHOSTUNREACH), while Apple's /usr/bin/curl reaches it from the same shell. The existing fallback covered EHOSTUNREACH, ENETUNREACH and EPERM only, so the DNS case sent every notice to the outbox. notice.py now retries the same request once via curl when urllib's reason is a socket.gaierror or an OSError with errno EHOSTUNREACH, ENETUNREACH, EHOSTDOWN, ENETDOWN, ECONNREFUSED or EPERM. It never retries an HTTP status (HTTPError is handled first), a TLS error (ssl.SSLError is excluded before the errno test, because its errno 1 equals EPERM and a certificate failure must not be retried around), or a timeout. curl gets PULSEENGINE_WARTE_CACERT via --cacert and the body on stdin (--data-binary @-); no token or body is put in argv, and no host is hardcoded. A gaierror can arrive only after the resolver's own timeout, so the retry gets what is left of the caller's deadline and is skipped when that is spent, keeping a SessionEnd hook inside its budget. If curl fails too, the existing outbox semantics hold: the notice stays queued.
    status: verified
    release: 0.47.0
    category: functional
    priority: should
    fields:
      category: functional

