  - id: REQ-FACTORY-NOTICE-ATTENTION-BUDGET
    type: requirement
    title: The factory-notice inbox rations the owner's attention with a flow cap and decision windows
    description: >-
      On 2026-10-28 the owner reported that about 22 parallel agent sessions plus meetings leave him overloaded, and cited BCG/HBR research (March 2026) that oversight rather than use causes the fatigue, with productivity peaking at about three concurrent agents; he also asked to set his availability in warte and have it used everywhere. notice.py takes the schedule (attention.schema.json, schema_version 1: weekday-aware decision windows, available hours, focus blocks, off periods, max_asking_flows, always_open_kinds, timezone) from the first valid source of warte's GET /api/attention (cached in <store>/attention.cache.json with fetched_at and attempted_at, so neither a success nor a failure is repeated for 10 minutes; a 404, unreachable or invalid answer counts as unavailable), that cache up to 14 days old, the local file and the built-in defaults, and names the source in the digest, the hook and notice.py attention. The SessionStart hook reads only the cache. Questions surface only inside a decision window, inside the available hours when set, and outside an off period; in an off period window-tick writes and posts nothing so the next digest covers the gap, and in a focus block it writes the digest and holds the notification. The local file is ${PULSEENGINE_ATTENTION_FILE:-~/.config/pulseengine/attention.json}; notice.py creates it with the defaults (max_asking_flows 3, windows 08:30-09:00 and 17:00-17:30, timezone local, always_open_kinds security and red-main) only when it is missing, never overwrites it, and on an invalid file says so once and uses the defaults. A needs-decision is surfaced only when its flow, keyed by (agent, flow), is among the first max_asking_flows flows ordered by their oldest open decision's opened_at, or when its kind or a tag is in always_open_kinds; such an always-open decision also bypasses the windows, the available hours and focus blocks (outside a window the hook shows it and window-tick notifies once, counts only) but never an off period; every other decision is queued, kept, and promoted as earlier flows clear, a flow clearing as soon as the owner has answered it locally. Queued is computed on every read and never stored, so the answer-safety rules are unchanged; notice schema_version 2 adds tags, opened_at and the view status queued, and version 1 notices are still read. Outside the windows the SessionStart hook shows answers waiting and a count, never a decision's title, question or options. notice.py digest writes one grouped DIGEST.md (and --format json) with a stats line (open, surfaced, queued, flows asking, oldest age, answered in 7 days) and a since-the-last-digest section that is the only place shipped, blocked, info and session-summary notices appear. notice.py window-tick is idempotent, rewrites the digest only when it changed and, on macOS with osascript, posts one notification per new surfaced decision set whose text is two counts, passed as an argument rather than script source. notice.py review answers surfaced decisions in one sitting through the existing answer path and refuses a non-interactive stdin. A launchd template and a systemd timer are documented, not installed.
    status: verified
    release: 0.45.0
    category: functional
    priority: should
    fields:
      category: functional

