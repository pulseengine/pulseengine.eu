# The CI gates, as requirements with the gate script as their verification.
#
# The `verification` artifacts are `verified`, not `implemented`: every gate here
# was red-first checked — run against the defect it exists to catch and seen to
# fail — before being wired into CI. That is verification of the test itself, and
# it is why `gate-potency` exists in this plugin. A gate that has never been seen
# to fail is a gate nobody has verified.
#
# Each `verification` carries a `verifies` link AND the script carries a
# `# rivet: verifies REQ-...` source marker, so `rivet verify` cites both the
# artifact link and the line of code. Written against rivet 0.39.0, the version
# the signed layer ships.

artifacts:
  - id: FEAT-CI-GATES
    type: feature
    title: Mechanical gates on every pull request
    description: >-
      Each gate is red-first verified against the defect it exists to catch
      before being wired into CI, so a green run means the check could still
      have failed.
    status: verified
    release: "0.34.0"
    links:
      - type: satisfies
        target: REQ-LINKS
      - type: satisfies
        target: REQ-MANIFEST-SYNC
      - type: satisfies
        target: REQ-CITATIONS
      - type: satisfies
        target: REQ-LIGHT-MODE
      - type: satisfies
        target: REQ-SKILL-LOADS
      - type: satisfies
        target: REQ-VIEW-STYLED
      - type: satisfies
        target: REQ-ASSET-FRESH
      - type: satisfies
        target: REQ-CLAIMS-HOLD
      - type: satisfies
        target: REQ-PLUGIN-VERSION-CURRENT
      - type: satisfies
        target: REQ-README-ROSTER
      - type: satisfies
        target: REQ-ISSUE-CLASS-RATCHET
      - type: satisfies
        target: REQ-NO-BUILD-ARTIFACTS
      - type: satisfies
        target: REQ-ISSUE-HUNT-SWEEPS-PRS
      - type: satisfies
        target: REQ-COUPLED-ARTIFACTS-GATED
      - type: satisfies
        target: REQ-FEATURE-LOOP-COUPLED-PAIRS

      - type: satisfies
        target: REQ-CI-STATUS-SKILL
      - type: satisfies
        target: REQ-PUBLICATION-REVIEW-SKILL
      - type: satisfies
        target: REQ-FACTORY-REPORT-INSTRUMENT-GATE
      - type: satisfies
        target: REQ-RELEASE-DOCS-ARCHIVE-RULE
      - type: satisfies
        target: REQ-ISSUE-COMMENTS-TO-REPORTER
      - type: satisfies
        target: REQ-CLEAN-ROOM-INDEPENDENCE-RECORD
  - id: REQ-LINKS
    type: requirement
    title: Every internal link in the built site resolves
    description: >-
      No internal href in the built output may 404. `zola check --skip-external-links` is vacuous against raw absolute hrefs — verified by negative control: it exits 0 with a dead link present.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-LINKS
    type: verification
    title: check-internal-links.py
    description: >-
      Parses the built HTML, handles all three href quoting forms that minification produces, and resolves each internal link against public/. Returns 2 if it matched zero links, so a broken regex cannot report a clean run.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-internal-links.py
    links:
      - type: verifies
        target: REQ-LINKS

