# The CI gates, as requirements with the gate script as their verification.
#
# The `verification` artifacts are `verified`, not `implemented`: every gate here
# was red-first checked — run against the defect it exists to catch and seen to
# fail — before being wired into CI. That is verification of the test itself, and
# it is why `gate-potency` exists in this plugin. A gate that has never been seen
# to fail is a gate nobody has verified.
#
# Each `verification` carries a `verifies` link AND the script carries a
# `# rivet: verifies REQ-...` source marker, so `rivet verify` cites both the
# artifact link and the line of code. Written against rivet 0.39.0, the version
# the signed layer ships.

artifacts:
  - id: FEAT-CI-GATES
    type: feature
    title: Mechanical gates on every pull request
    description: >-
      Each gate is red-first verified against the defect it exists to catch
      before being wired into CI, so a green run means the check could still
      have failed.
    status: verified
    release: "0.34.0"
    links:
      - type: satisfies
        target: REQ-LINKS
      - type: satisfies
        target: REQ-MANIFEST-SYNC
      - type: satisfies
        target: REQ-CITATIONS
      - type: satisfies
        target: REQ-LIGHT-MODE
      - type: satisfies
        target: REQ-SKILL-LOADS
      - type: satisfies
        target: REQ-VIEW-STYLED
      - type: satisfies
        target: REQ-ASSET-FRESH
      - type: satisfies
        target: REQ-CLAIMS-HOLD
      - type: satisfies
        target: REQ-PLUGIN-VERSION-CURRENT
      - type: satisfies
        target: REQ-README-ROSTER
      - type: satisfies
        target: REQ-ISSUE-CLASS-RATCHET
      - type: satisfies
        target: REQ-NO-BUILD-ARTIFACTS
      - type: satisfies
        target: REQ-ISSUE-HUNT-SWEEPS-PRS

  - id: REQ-LINKS
    type: requirement
    title: Every internal link in the built site resolves
    description: >-
      No internal href in the built output may 404. `zola check --skip-external-links` is vacuous against raw absolute hrefs — verified by negative control: it exits 0 with a dead link present.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-LINKS
    type: verification
    title: check-internal-links.py
    description: >-
      Parses the built HTML, handles all three href quoting forms that minification produces, and resolves each internal link against public/. Returns 2 if it matched zero links, so a broken regex cannot report a clean run.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-internal-links.py
    links:
      - type: verifies
        target: REQ-LINKS

  - id: REQ-MANIFEST-SYNC
    type: requirement
    title: The storefront advertises the plugin that actually installs
    description: >-
      `.claude-plugin/marketplace.json` is what a reader sees; plugin.json is what installs. Drift is invisible: measured 2026-08-26 the manifest advertised 0.12.0 and fourteen skills while the plugin was 0.25.0 with sixteen.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-MANIFEST-SYNC
    type: verification
    title: check-plugin-manifest.py
    description: >-
      Compares version and description between the two manifests, and checks the spelled-out skill count against skills/ on disk.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-plugin-manifest.py
    links:
      - type: verifies
        target: REQ-MANIFEST-SYNC

  - id: REQ-CITATIONS
    type: requirement
    title: Every post the plugin cites exists
    description: >-
      The plugin attributes claims to posts by slug. Deleting a draft in #169 left four citations pointing at files that no longer existed, invisible for eleven days because a citation is prose, not a link.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-CITATIONS
    type: verification
    title: check-post-citations.py
    description: >-
      Resolves each cited slug against content/blog/, matching on stem rather than filename so a date correction does not break a citation.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-post-citations.py
    links:
      - type: verifies
        target: REQ-CITATIONS

  - id: REQ-LIGHT-MODE
    type: requirement
    title: Every diagram is legible in light mode
    description: >-
      Mermaid compiles classDef into the rendered SVG where outer CSS cannot reach it, so light mode is done by rewriting known hex values at runtime. An unmapped surface colour renders dark on dark — washed out rather than obviously broken, which is why it survived.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-LIGHT-MODE
    type: verification
    title: check-mermaid-light-mode.py
    description: >-
      Requires every hex in a mermaid block to be in the patcher's replacement map or on the semantic-accent allowlist.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-mermaid-light-mode.py
    links:
      - type: verifies
        target: REQ-LIGHT-MODE

  - id: REQ-SKILL-LOADS
    type: requirement
    title: Every skill loads in the agent runtimes we support
    description: >-
      `name` must be 64 characters or fewer and match its directory; `description` 1024 or fewer. Over-length does not warn — GitHub Copilot CLI refuses to load the skill, so it is simply absent.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-SKILL-LOADS
    type: verification
    title: check-skill-frontmatter.py
    description: >-
      Reads each SKILL.md frontmatter and checks both limits and the name/directory match.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-skill-frontmatter.py
    links:
      - type: verifies
        target: REQ-SKILL-LOADS

  - id: REQ-VIEW-STYLED
    type: requirement
    title: Every class the layer view emits is styled
    description: >-
      The view builds its whole DOM in JavaScript, so a class the script emits and the stylesheet does not define renders unstyled while everything still builds. Porting the prototype produced six such defects, all of which built cleanly.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-VIEW-STYLED
    type: verification
    title: check-layers-view.py
    description: >-
      Diffs the classes layers.js emits against those _layers.scss defines, and catches a class name assigned where a CSS value belongs.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-layers-view.py
    links:
      - type: verifies
        target: REQ-VIEW-STYLED

  - id: REQ-ASSET-FRESH
    type: requirement
    title: A deploy cannot serve a stale stylesheet
    description: >-
      The host sends no Cache-Control, only ETag and Last-Modified, so browsers cache heuristically and do not revalidate. A reader got new HTML and new JS against a main.css days old, and the page rendered unstyled.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-ASSET-FRESH
    type: verification
    title: check-asset-cachebust.py
    description: >-
      Requires every static asset reference in the templates to carry cachebust=true, so the URL changes when the bytes do.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-asset-cachebust.py
    links:
      - type: verifies
        target: REQ-ASSET-FRESH

  - id: REQ-CLAIMS-HOLD
    type: requirement
    title: The plugin's load-bearing claims are bound to evidence
    description: >-
      One session turned up seven false claims inside the plugin, every one found by tripping over it rather than by a check. The honest statement for these is a string in a document, which is what the claim-verification mechanism is for.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-CLAIMS-HOLD
    type: verification
    title: claim-check.py
    description: >-
      Runs the plugin's own claim-verification reference implementation against claims.yaml; each entry is an assertion that was false at some point in this repo's history.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: claude-tooling/plugins/pulseengine-claude/skills/claim-verification/claim-check.py
    links:
      - type: verifies
        target: REQ-CLAIMS-HOLD

  - id: REQ-PLUGIN-VERSION-CURRENT
    type: requirement
    title: The plugin version tracks the plugin's content
    description: >-
      The cache keys on plugin.json's version, so two trees carrying the same version are indistinguishable to anyone who installed the first. Measured 2026-10-02: five plugin files had changed after v0.32.0 was set, with no bump.
    status: verified
    release: "0.34.0"
    category: functional
    priority: must

  - id: VER-PLUGIN-VERSION-CURRENT
    type: verification
    title: check-plugin-version-current.py
    description: >-
      Finds the commit that set the current version and fails if any plugin file changed after it. Treats an uncommitted bump as in flight.
    status: verified
    release: "0.34.0"
    method: automated-test
    test-location: scripts/check-plugin-version-current.py
    links:
      - type: verifies
        target: REQ-PLUGIN-VERSION-CURRENT

  - id: REQ-README-ROSTER
    type: requirement
    title: The plugin README documents every installed skill
    description: >-
      The manifests carry a spelled-out skill COUNT; only the README says what each skill does. Measured 2026-10-14 the roster listed 14 of 18 — evidence-transfer, gate-potency, repo-hygiene and verify-your-own-claims were installed, loadable, triggering and undocumented, and the count check could not see it.
    status: verified
    release: 0.36.0
    category: functional
    priority: must

  - id: VER-README-ROSTER
    type: verification
    title: check-readme-skill-roster.py
    description: >-
      Derives both sides from disk — every skills/ directory has a README bullet, and every README bullet names a directory that exists. Negative-controlled in both directions on 2026-10-14 (dropped bullet, phantom entry).
    status: verified
    release: 0.36.0
    method: automated-test
    test-location: scripts/check-readme-skill-roster.py
    links:
      - type: verifies
        target: REQ-README-ROSTER

  - id: REQ-ISSUE-CLASS-RATCHET
    type: requirement
    title: The issue-hunt backlog brake exists and cannot silently pass
    description: "issue-hunt's exit condition is a release, not an empty tracker, and nothing limited intake — rivet 33 open and spar 37 open on 2026-10-21, spar up from 1 open on 2026-03-31. This requirement is on the MECHANISM only: a brake exists, it splits the queue by whether a mechanical oracle exists (agent-closable, uncapped) rather than by who filed the issue, and it cannot report green without being able to report red. Whether any particular tracker is actually classified is deliberately NOT scoped here: that is a property of rivet's and spar's trackers and belongs in their own release plans, because coupling this plugin's release to work in two other repos makes it unreproducible over time. Provenance is not the axis and is also not available — every non-bot issue in both repos is authored by one account, and the title-length proxy agrees with the Claude Code body marker only 20 percent of the time on rivet's 259 non-bot issues and 35 percent on spar's."
    status: verified
    release: 0.37.0
    category: process
    priority: must

  - id: VER-ISSUE-CLASS-RATCHET
    type: verification
    title: check-issue-classes.py
    description: >-
      Pure check over fetched issues, so the 17-case --self-test decision table needs no network and runs from ci.yml's build job, the only context branch protection requires; the live tracker check is scheduled, because queue state drifts with no PR involved. Asserts each rule in BOTH directions, and pins the known trivial-reproducer gap as an explicit case so it cannot change silently. Potency measured 2026-10-21 three ways — the self-test holds 17 of 17; seven source mutations (repro check satisfied, both-labels rule removed, brake off-by-one, staleness disabled, unclassified rule removed, below-floor branch removed, staleness aged from createdAt instead of the label) were all caught with zero survivors; and the live run reddens on production, reporting 33 unclassified in rivet and 37 in spar. A missing cross-repo token exits 2, could not run, never 0. Status is implemented rather than verified because the live half has never been green: the requirement it encodes is not yet met.
    status: verified
    release: 0.37.0
    method: automated-test
    test-location: scripts/check-issue-classes.py
    links:
      - type: verifies
        target: REQ-ISSUE-CLASS-RATCHET

  - id: REQ-NO-BUILD-ARTIFACTS
    type: requirement
    title: git tracks no build artifact
    description: >-
      Found by external review of #232: a compiled check-issue-classes .pyc rode along in that PR, and a fetch-layers .pyc had been tracked for longer. All ten gates ran green over both, because each asks whether a claim matches the tree and none asked what is in the tree; .gitignore had no Python entry at all. A .pyc is the worst case of the class — a stale, diff-opaque copy of a script a reviewer is reading, which can shadow its own source on import.
    status: verified
    release: 0.37.0
    category: functional
    priority: must

  - id: VER-NO-BUILD-ARTIFACTS
    type: verification
    title: check-no-build-artifacts.py
    description: >-
      Walks `git ls-files` and rejects any path inside __pycache__, node_modules, target or a tool cache, plus any compiled suffix. Extension- and directory-based on purpose: the site legitimately tracks fonts and images, so a generic binary sniff would need an allowlist long enough to hide a real artifact in. Red-first against the live defect on 2026-10-21 — written while both .pyc files were still tracked, reported exactly those two, then green once removed — and negative-controlled by planting a third.
    status: verified
    release: 0.37.0
    method: automated-test
    test-location: scripts/check-no-build-artifacts.py
    links:
      - type: verifies
        target: REQ-NO-BUILD-ARTIFACTS

  - id: REQ-ISSUE-HUNT-SWEEPS-PRS
    type: requirement
    title: issue-hunt's discovery step sees pull requests and reads comments by a comparable id
    description: >-
      Step 1 swept with `gh issue list`, which returns issues only, so every PR the loop did not open was invisible; four dependabot PRs on relay went unseen for a day (pulseengine.eu#233), and a pass on this repo missed dependabot #230 inside its own window. The comment fetch used `gh issue view --json comments`, whose GraphQL node ids never compare with the REST ids stored as last_seen_comment_id, and without --paginate the REST endpoint truncates at 30 (jess#167, 30 of 50).
    status: verified
    release: 0.38.0
    category: functional
    priority: must

  - id: VER-ISSUE-HUNT-SWEEPS-PRS
    type: verification
    title: claim ISSUE-HUNT-SWEEPS-PRS-AND-PAGINATES
    description: >-
      claim-check requires the skill to carry both the `gh pr list` sweep and the paginated REST comment fetch, and forbids the GraphQL comment fetch from returning. Negative-controlled on 2026-10-21: replacing the PR sweep with a second issue sweep turns claim-check red (exit 1), restoring it turns it green.
    status: verified
    release: 0.38.0
    method: automated-test
    test-location: claims.yaml
    links:
      - type: verifies
        target: REQ-ISSUE-HUNT-SWEEPS-PRS

