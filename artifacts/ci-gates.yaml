  - id: REQ-AGENT-MODEL-REMINDER
    type: requirement
    title: A PreToolUse hook reminds the agent to choose `model:` on an Agent call, and never blocks it
    description: >-
      Owner-approved 2026-10-29 with REQ-DELEGATE-BY-COST-TRIGGER: since a skill's body was never read, the rule is put in front of the agent at the one moment it applies. hooks/agent-model-reminder.sh (PreToolUse, matcher Agent|Task) runs agent-model-reminder.py (python3 3.9, stdlib, no network, no files) and, when `model` is missing and `subagent_type` is absent, general-purpose or claude, prints only hookSpecificOutput.additionalContext with a one-line reminder. It is silent on every other case (model set, fork, Explore, Plan, claude-code-guide, any plugin or project agent, whose own frontmatter `model:` it cannot see, a non-Agent tool, malformed or empty input). It never prints permissionDecision (no value, not even allow, which would skip the user's permission flow), updatedInput, decision or continue, and the wrapper always exits 0 with stderr silenced, so a missing or crashing python3 is not a hook error. Claude Code adds PreToolUse context with the tool result, so the reminder shapes the next Agent call, not the one that triggered it. Annoyance measured over the local transcript archive (a 30-day window, not the 1,531-session study; 2026-10-29, deduplicated by tool_use id): of 2,193 Agent calls in 19 sessions it would have fired on 1,486 (67.8%: general-purpose 1,272, no subagent_type 191, claude 23), up to 367 times in one session (median 51 per firing session), which is why the reminder is one short line. Throttle (owner decision 2026-10-29, same release): per session_id, remind on the first missing call and then on every 10th consecutive missing call after the last reminder (calls 1, 11, 21, ...); a call that sets `model:` resets the count; neutral calls (fork, Explore, plugin agents) neither count nor reset. State is one JSON file per session under $CLAUDE_PLUGIN_DATA/agent-model-reminder/ (documented as the plugin's persistent data dir and exported to hook commands), else $TMPDIR/pulseengine-claude/agent-model-reminder/, written atomically (temp file plus os.replace), with session ids outside [A-Za-z0-9_-] hashed and state older than 7 days pruned when a new session's file is created. Missing or corrupt state, an unwritable dir and a missing session_id fail open to a reminder; the call is never blocked. Replayed over the same archive in timestamp order (2,195 calls, 19 sessions): 131 reminders (6.0% of Agent calls), median 6 per firing session, p90 18, max 28.
    status: verified
    release: 0.47.0
    category: functional
    priority: should
    fields:
      category: functional

