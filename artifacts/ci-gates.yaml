  - id: REQ-FACTORY-NOTICE
    type: requirement
    title: Unattended agents report notices and post decisions to the owner without blocking
    description: >-
      The owner asked on 2026-10-28 that unattended agents report into warte, still work with no warte (at an employer) through local per-agent storage, notify on needs-decision, blocked, shipped and session end, and present a decision as an option dialogue whose answer can come through warte or directly into the agent. The plugin gains the factory-notice skill. notice.schema.json (schema_version 1) is the single definition of a notice (kinds heartbeat, shipped, blocked, needs-decision, session-summary, info; lineage agent, session, parent, repo, flow, links; a decision adds question, options with description, pros and cons, recommended and why, reversible, blocks, revision and status) and of an answer. notice.py, standard library only, loads that file and refuses any schema keyword it does not implement; its subcommands are post, list, answer, poll and sync. It writes every notice to a user-level store under ~/.local/state/pulseengine/notices/<agent>/ (or PULSEENGINE_NOTICE_DIR) and, when PULSEENGINE_WARTE_URL answers, to warte as agent data of type notice.v1 and answer.v1, saying once when warte is unavailable or refuses a write (the deployed warte answers 401 to writes without a bearer token) and keeping unsent notices in an outbox. When urllib gets EHOSTUNREACH, ENETUNREACH or EPERM (measured 2026-10-28 on macOS, python3 could not reach warte where curl could, probably per-binary Local Network privacy, not confirmed) it retries the request through curl. The skill tells the agent not to take a fork it posted, to continue with independent work, to poll on each wake, never to apply its recommendation on a timeout, and to wait on irreversible actions. A SessionStart hook lists open decisions and waiting answers without consuming them; a SessionEnd hook posts a minimal summary when the agent posted none and the session changed something, writing locally and handing the outbox to a detached sync. Neither hook waits on warte for more than 3 seconds, because a connection to the deployed warte took 2.3 seconds to connect from a plain shell and 5.0 seconds inside the agent sandbox; both exit 0 on every path and are silent on failure. No warte host or certificate path is written into the plugin.
    status: verified
    release: 0.44.0
    category: functional
    priority: should
    fields:
      category: functional

