    description: >-
      claim-check requires the schema file, the script's load of it by name, the kind and status lists to appear once under claude-tooling/, both schema_version consts, the two loud failures on an unimplemented keyword and the CI self-test step; the skill's never-auto-apply, irreversible-waits and do-not-take-the-fork rules verbatim, no code path that assigns the recommendation to option_id, and the operating contract's pointer; the default store path in the skill and the script, no .warte/ path in the script and the two offline self-test cases; and no URL in any factory-notice file or its hook, and no certificate path under claude-tooling/. notice.py --self-test (43 cases, in CI) covers schema validation, the local store round trip with warte unset and unreachable, the warte client against an in-process stub (register once, find by name, notice.v1 rows, the curl transport, and a 401-on-write mode like the deployed warte) and the hooks. A self-test mutant that treats a 401 as success exits 1 with 2 cases failing; dropping the say-once flag survives, because availability is cached after the first failure and no tested path says a message twice. Negative-controlled on 2026-10-28, eight mutants each exit 1: the kind list copied into the script, the schema file renamed, the CI step dropped, the recommendation assigned in code, the never-auto-apply rule reworded, the store moved to .warte/, a public URL in the skill and a certificate path in the hook.
    status: verified
