  - id: REQ-ASSET-FRESH
    type: requirement
    title: A deploy cannot serve a stale stylesheet
    description: >-
      The host sends no Cache-Control, only ETag and Last-Modified, so browsers cache heuristically and do not revalidate. A reader got new HTML and new JS against a main.css days old, and the page rendered unstyled.
