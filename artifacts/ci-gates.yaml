  - id: REQ-FACTORY-NOTICE-ANSWER-SAFETY
    type: requirement
    title: An answer is accepted only for an offered option at the current revision, once
    description: >-
      An answer to a decision is an instruction to the agent, and an answer.v1 row in warte is not proof the owner wrote it: on warte's main a write needs a bearer token, but the data handler does not compare the token's agent with the agent id in the path, and reads are public (pulseengine/warte#46). notice.py poll accepts an answer only when the notice id is one the agent posted, option_id is one of the options it offered on that notice, the revision equals the notice's current revision (re-posting a decision supersedes every earlier answer) and no answer was accepted for that notice and revision before; each rule is checked against the agent's local copy of the notice, never a copy read from warte. The consumed record is created with O_EXCL so the first accepted answer wins across processes. The answer's note is printed quoted and labelled as data from the owner, not instructions. Rejected answers are reported once with their reason.
    status: verified
    release: 0.44.0
    category: functional
    priority: must
    fields:
      category: functional

