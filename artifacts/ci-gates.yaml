  - id: REQ-REFACTOR-DECISION
    type: requirement
    title: The plugin says when and how to refactor, and excludes rivet and spar until 2027-02-01
    description: >-
      Owner decision 2026-10-29 on pulseengine.eu#294 (relay, 500 merges measured: rule C "second copy or path of a rule" strongest, rule A "2nd re-fix in a file within 60 merges" 1 of 6 firings true, rule D "3 or more review findings in one file" late but unambiguous). The new skill refactor-decision is the single source. Its first section says it does not apply in pulseengine/rivet or pulseengine/spar before 2027-02-01, because the pre-registered hotspot experiment (docs/experiments/2026-10-hotspot-trigger.md, window 2026-11..2027-01) promises no other process change there; it checks every remote of the checkout (SSH and HTTPS, an upstream remote included) and the UTC date; that grep alone decides which repositories are excluded, and a PR into either repository or a checkout with no remote is excluded too. Four triggers, each with its evidence: (a) preparatory refactoring as its own behaviour-preserving step before a feature that does not fit; (b) a second copy of a rule or a second path for one decision, answered by deleting the first copy or naming the one owner; (c) a re-fix chain or review cluster, which yields a recorded none/small/large decision with a reason and never an automatic refactor, preferring small when it removes the defect class and never splitting a file for size alone; (d) litter pickup bounded to code the change already edits, the skill's bounded exception to the contract's minimal-scope rule. How: no refactor lands without behaviour-preservation evidence (unchanged tests green before and after; for numeric or control code an old-vs-new differential run with identical outputs); refactoring is kept apart from behaviour change; every refactor names its purpose; "refactor X" without a purpose and a check is clarified, not executed (arXiv 2610.36346); a merge-queue ejection is read as a possible interaction defect, not a flake. Decisions are recorded on the issue or PR, as a rivet design-decision where the schema has one, pointed to from the working context, and a large decision goes to the owner through factory-notice. ci-status, pulseengine-feature-loop, oracle-gate-a-change, issue-hunt, repo-hygiene, clean-room-verification and the operating contract point to it, each pointer stating the rivet/spar exclusion, and carry none of its rules; no other skill and no memory file mentions litter pickup or preparatory refactoring; the contract, which is always-on memory and loads in rivet and spar, states the exclusion in its pointer and does not mention litter pickup. The experiment doc carries a dated note of the exclusion.
    status: verified
    release: 0.46.0
    category: functional
    priority: must
    fields:
      category: functional

