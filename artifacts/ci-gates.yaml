, always-open bypass without a slot; window start and end, a window crossing midnight; the digest's stats, grouping and informational section; tick idempotence, informational rewrites without a notification, nothing outside a window, a new window notifying again; notification text free of notice and note text; review refusing a non-tty and answering through the answer path; v1 notices read and budgeted; the hook outside and inside a window. Negative-controlled on 2026-10-28: 27 claim mutants each exit 1 on claim-check and were restored by re-editing (cap 3 to 4 in code and in the skill, the cap as a literal, the store accepting queued, "kept" dropped, the hook showing open decisions, the unfiltered render, the rule reworded, off periods ignored, a title in the text, the notifier given other text, the text spliced into the AppleScript, the format string widened, warte never asked, the stale limit dropped, the hook asking warte, the source order reworded, the failed-fetch case dropped, the urgent outside-window path removed, urgent notified on every tick, urgent held in focus, the urgent rule reworded, the off check moved after the urgent path, the hook showing urgent decisions while off, the off rule reworded, notices no longer reading version 1, the version 2 rule dropped), and 33 code mutants each exit 1 on the self-test with a named case failing.
