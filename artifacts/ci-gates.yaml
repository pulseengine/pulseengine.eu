  - id: REQ-PR-BATCH-TRIVIAL
    type: requirement
    title: Trivial changes go into one PR per repo per session
    description: >-
      With strict up-to-date branch protection each merge puts every other open PR in the repo behind main, and updating it re-runs its full CI, so merging k open PRs one after another costs about k(k+1)/2 runs instead of k. The always-on operating contract gains "One PR per repo per session for trivial changes": docs edits, one-liners and tidy-ups go into one PR per repo per session, a later trivial change becomes a commit on that PR and never a push onto another session's branch, and a cross-repo sweep is N PRs each opened when its repo admits it rather than all at once. It names the merge queue as the structural fix and points to ci-status for admission. The contract is the single home because pulseengine-feature-loop does not fire for single-file changes; the feature loop's land step and issue-hunt's PR step point to it.
    status: verified
