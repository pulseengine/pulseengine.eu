  - id: REQ-ISSUE-CLASS-RATCHET
    type: requirement
    title: The issue-hunt backlog brake exists and cannot silently pass
    description: "issue-hunt's exit condition is a release, not an empty tracker, and nothing limited intake — rivet 33 open and spar 37 open on 2026-10-21, spar up from 1 open on 2026-03-31. This requirement is on the MECHANISM only: a brake exists, it splits the queue by whether a mechanical oracle exists (agent-closable, uncapped) rather than by who filed the issue, and it cannot report green without being able to report red. Whether any particular tracker is actually classified is deliberately NOT scoped here: that is a property of rivet's and spar's trackers and belongs in their own release plans, because coupling this plugin's release to work in two other repos makes it unreproducible over time. Provenance is not the axis and is also not available — every non-bot issue in both repos is authored by one account, and the title-length proxy agrees with the Claude Code body marker only 20 percent of the time on rivet's 259 non-bot issues and 35 percent on spar's."
    status: verified
    release: 0.37.0
    category: process
    priority: must

  - id: VER-ISSUE-CLASS-RATCHET
    type: verification
    title: check-issue-classes.py
    description: >-
      Pure check over fetched issues, so the 17-case --self-test decision table needs no network and runs from ci.yml's build job, the only context branch protection requires; the live tracker check is scheduled, because queue state drifts with no PR involved. Asserts each rule in BOTH directions, and pins the known trivial-reproducer gap as an explicit case so it cannot change silently. Potency measured 2026-10-21 three ways — the self-test holds 17 of 17; seven source mutations (repro check satisfied, both-labels rule removed, brake off-by-one, staleness disabled, unclassified rule removed, below-floor branch removed, staleness aged from createdAt instead of the label) were all caught with zero survivors; and the live run reddens on production, reporting 33 unclassified in rivet and 37 in spar. A missing cross-repo token exits 2, could not run, never 0. Status is implemented rather than verified because the live half has never been green: the requirement it encodes is not yet met.
    status: verified
    release: 0.37.0
    method: automated-test
    test-location: scripts/check-issue-classes.py
    links:
      - type: verifies
        target: REQ-ISSUE-CLASS-RATCHET

  - id: REQ-NO-BUILD-ARTIFACTS
    type: requirement
    title: git tracks no build artifact
    description: >-
      Found by external review of #232: a compiled check-issue-classes .pyc rode along in that PR, and a fetch-layers .pyc had been tracked for longer. All ten gates ran green over both, because each asks whether a claim matches the tree and none asked what is in the tree; .gitignore had no Python entry at all. A .pyc is the worst case of the class — a stale, diff-opaque copy of a script a reviewer is reading, which can shadow its own source on import.
    status: verified
    release: 0.37.0
    category: functional
    priority: must

  - id: VER-NO-BUILD-ARTIFACTS
    type: verification
    title: check-no-build-artifacts.py
    description: >-
      Walks `git ls-files` and rejects any path inside __pycache__, node_modules, target or a tool cache, plus any compiled suffix. Extension- and directory-based on purpose: the site legitimately tracks fonts and images, so a generic binary sniff would need an allowlist long enough to hide a real artifact in. Red-first against the live defect on 2026-10-21 — written while both .pyc files were still tracked, reported exactly those two, then green once removed — and negative-controlled by planting a third.
    status: verified
    release: 0.37.0
    method: automated-test
    test-location: scripts/check-no-build-artifacts.py
    links:
      - type: verifies
        target: REQ-NO-BUILD-ARTIFACTS

  - id: REQ-ISSUE-HUNT-SWEEPS-PRS
    type: requirement
    title: issue-hunt's discovery step sees pull requests and reads comments by a comparable id
    description: >-
      Step 1 swept with `gh issue list`, which returns issues only, so every PR the loop did not open was invisible; four dependabot PRs on relay went unseen for a day (pulseengine.eu#233), and a pass on this repo missed dependabot #230 inside its own window. The comment fetch used `gh issue view --json comments`, whose GraphQL node ids never compare with the REST ids stored as last_seen_comment_id, and without --paginate the REST endpoint truncates at 30 (jess#167, 30 of 50).
    status: verified
    release: 0.38.0
    category: functional
    priority: must

  - id: VER-ISSUE-HUNT-SWEEPS-PRS
    type: verification
    title: claim ISSUE-HUNT-SWEEPS-PRS-AND-PAGINATES
    description: >-
      claim-check requires the skill to carry both the `gh pr list` sweep and the paginated REST comment fetch, and forbids the GraphQL comment fetch from returning. Negative-controlled on 2026-10-21: replacing the PR sweep with a second issue sweep turns claim-check red (exit 1), restoring it turns it green.
    status: verified
    release: 0.38.0
    method: automated-test
    test-location: claims.yaml
    links:
      - type: verifies
        target: REQ-ISSUE-HUNT-SWEEPS-PRS

  - id: REQ-COUPLED-ARTIFACTS-GATED
    type: requirement
    title: Pairs of artifacts that must agree are checked as a pair, failing closed on an empty side
    description: >-
      Two artifacts that must agree drift apart while each passes its own checks, because nothing owns the relationship (pulseengine.eu#198). Found in this repo on 2026-10-21: the plugin README said 18 skills against 19 on disk while the roster check reading the same file passed, CONTRIBUTING's shortcode table listed a pipeline() with no file, and the claim-verification skill documented a `badge` evidence kind the checker never implemented. claim-check gains set-equal (two sets, both directions) and count-equals (a stated number against a set's size), each failing when a side yields nothing.
    status: verified
    release: 0.39.0
    category: functional
    priority: must

  - id: VER-COUPLED-ARTIFACTS-GATED
    type: verification
    title: claim-check --self-test and the coupled-artifact claims
    description: >-
      13-case decision table, each rule in both directions, run in CI before the claims. Two cases isolate the empty-side guards with every difference waived, added after a mutant disabling the doc-side guard survived the first table. 8 of 8 source mutations caught. Red-first on the real defects: PLUGIN-README-SKILL-COUNT reported "states 18, the source holds 19" before the README was fixed; CONTRIBUTING-SHORTCODES-MATCH-DISK and CLAIM-KINDS-DOCUMENTED-EQUALS-IMPLEMENTED negative-controlled in both directions.
    status: verified
    release: 0.39.0
    method: automated-test
    test-location: claude-tooling/plugins/pulseengine-claude/skills/claim-verification/claim-check.py
    links:
      - type: verifies
        target: REQ-COUPLED-ARTIFACTS-GATED

  - id: REQ-FEATURE-LOOP-COUPLED-PAIRS
    type: requirement
    title: The feature loop tells an agent to name and gate every coupled pair a change touches
    description: >-
      Per-artifact rigour does not catch drift between artifacts: relay ran a flight core and published components that disagreed for about 3 months and 40 releases with every artifact green. The feature loop's oracle step now names the six recurring pair shapes and the three rules that make such a check real.
    status: verified
    release: 0.39.0
    category: process
    priority: should

  - id: VER-FEATURE-LOOP-COUPLED-PAIRS
    type: verification
    title: claim FEATURE-LOOP-GATES-COUPLED-PAIRS
    description: >-
      claim-check requires the step's anchor text and each of its three rules in the feature-loop skill.
    status: verified
    release: 0.39.0
    method: automated-test
    test-location: claims.yaml
    links:
      - type: verifies
        target: REQ-FEATURE-LOOP-COUPLED-PAIRS


  - id: REQ-CI-STATUS-SKILL
    type: requirement
    title: Waiting on CI asks the fleet's status API first, and never writes its host into a repo
    description: >-
      Agents waited on pull-request checks by polling GitHub at fixed short intervals, one model turn per poll, unable to tell a running job from one starved of a runner. On 2026-10-22 this session alone polled GitHub every 15 to 20 seconds while the self-hosted fleet's status API could have given a measured start range. The ci-status skill reads that API, configured only through PULSEENGINE_CI_STATUS_URL and PULSEENGINE_CI_STATUS_CACERT, reports an overdue job and a missing or unreachable API once, falls back to gh pr checks with its exit codes, and wakes on the API's recheck interval. The API's host is private infrastructure and must not appear in the public plugin.
    status: verified
    release: 0.40.0
    category: process
    priority: should
    fields:
      category: functional

  - id: VER-CI-STATUS-SKILL
    type: verification
    title: claims CI-STATUS-NO-PRIVATE-HOST and CI-STATUS-FALLS-BACK-AND-SAYS-SO
    description: >-
      claim-check requires the skill's fallback rule, the gh exit-code table, the unknown-is-not-not_queued rule and the no-double-subtraction rule verbatim, requires the three waiting skills to point at ci-status, and fails if an mDNS .local URL, the local CA directory or a Caddy root certificate name appears anywhere under claude-tooling/. Negative-controlled: a .local URL written into the skill makes the check exit 1.
    status: verified
    release: 0.40.0
    method: automated-test
    test-location: claims.yaml
    links:
      - type: verifies
        target: REQ-CI-STATUS-SKILL

  - id: REQ-PUBLICATION-REVIEW-SKILL
    type: requirement
    title: Public prose is gated on a role-split clean-room review before it ships
    description: >-
      Between 2026-10-25 and 2026-10-27 four blog posts drafted with another model were published or scheduled with an invented clause inside a quotation that carried the post's thesis, invented CLI output, wrong author names and a non-existent book in citations, wrong arithmetic, assumptions presented as measurements, and wrongly cited ASPICE process IDs, all under a green build. The publication-review skill gates ready = true on a post, and any public claim-heavy page, on cold domain-expert, fact-checker and editor reviewers briefed with files and rules only, a fixer applying confirmed findings, and a fresh second round, stopping after three rounds. Any refuted quote, number or citation, any overclaim about verification or proof, any private infrastructure detail, and any cannot-verify left at full strength blocks publication. hold = true must sit on its own line, because the autopublish regex does not see it with a trailing comment.
    status: verified
    release: 0.41.0
    category: functional
    priority: should
    fields:
      category: functional

  - id: VER-PUBLICATION-REVIEW-SKILL
    type: verification
    title: claim PUBLICATION-REVIEW-BLOCKING-RULES
    description: >-
      claim-check requires the skill's four blocking rules, the cold-briefing rules, the fixer's no-new-claims rule, the three-round stop rule and the hold-on-its-own-line rule verbatim, requires blog-autopublish.py's HOLD_RE to still be line-anchored with no comment allowance, and requires CONTRIBUTING.md to point authors at the skill before ready = true. Negative-controlled: dropping a blocking rule from the skill, letting HOLD_RE accept a trailing comment, or removing the CONTRIBUTING pointer each makes the check exit 1.
    status: verified
    release: 0.41.0
    method: automated-test
    test-location: claims.yaml
    links:
      - type: verifies
        target: REQ-PUBLICATION-REVIEW-SKILL
  - id: REQ-FACTORY-REPORT-INSTRUMENT-GATE
    type: requirement
    title: The monthly factory report is withheld when its classifier fails the frozen references
    description: >-
      The fix-hotspot experiment (docs/experiments/2026-10-hotspot-trigger.md) is pre-registered to be read from monthly measurements of rivet and spar, partly labelled by Claude Haiku. A model that drifts would move the measured shares with no process change behind them. Every monthly run therefore rebuilds the two frozen references (160 rivet/spar commits cut at 2026-10-22T10:13:00+02:00, and Levin and Yehudai's 400 human commits from Zenodo 835534), checks their sha256 against pinned values, scores the classifier with commit-classify.py's own scoring, and publishes nothing when fix precision is below 0.75 or recall below 0.70 on either. The model calls run on the owner's Claude subscription through the Claude Code CLI in print mode (pinned version, never bare mode, which ignores OAuth); without the CLAUDE_CODE_OAUTH_TOKEN secret the job exits 0 and does nothing, and a CLI failure, an auth failure or the subscription usage limit is "could not run" (exit 2) with nothing written.
    status: verified
    release: 0.41.0
    category: functional
    priority: must

  - id: VER-FACTORY-REPORT-INSTRUMENT-GATE
    type: verification
    title: factory-report.py --self-test and claim FACTORY-REPORT-WITHHOLDS-ON-INSTRUMENT-DRIFT
    description: >-
      Offline decision table run in ci.yml's required build job: the 22 October scores pass, exactly 0.75/0.70 passes, 0.74 precision and 0.69 recall fail, a missing reference fails, an instrument that never says fix fails, a failing check exits 1 without measuring or writing a file, malformed or missing labels are refused, an unset, empty or blank credential exits 0 with nothing written, a usage limit exits 2 with nothing written and the re-run instruction in the log, and publishing goes to a factory-report/ branch and a PR against main through stubbed REST calls. A stub in place of subprocess.run checks the exact Claude Code command for the classifier and the blinded diff judge (pinned model ids, effort low, verbose JSON output so rate-limit events are seen, the labels JSON schema, no tools, no MCP, no settings sources, never bare mode or a fallback model, the prompt on stdin, a fresh empty cwd), parses responses recorded from Claude Code 2.1.312 on 2026-10-28 in both output shapes, and drives the error paths (an is_error answer and an auth failure are not retried, 529, timeout and missing JSON are retried with backoff, a rejected rate-limit event or usage-limit wording is a usage limit, an answer from another model is refused). Negative-controlled on 2026-10-27 with 12 source mutants (each threshold, the missing-reference rule, the failure branch, the key check, the empty-key rule, measuring before the check, accepting a refusal, unblinded and unshuffled judge ids, a PR whose head is main), all killed; the CLI backend was negative-controlled on 2026-10-28 with 14 more (--verbose dropped, bare mode added, the tools pair dropped, the prompt in argv, effort dropped, the API format wrapper around the schema, a usage limit retried, a model swap accepted, no retries, the API key not withheld, the repo as cwd, a non-zero exit accepted, OAuth not a credential, structured_output ignored), all killed. The claim FACTORY-REPORT-WITHHOLDS-ON-INSTRUMENT-DRIFT binds the thresholds in the doc and the script together and was seen red (exit 1) with RECALL_MIN set to 0.65; its subscription pins (the OAuth secret in both workflow steps, no secrets.ANTHROPIC_API_KEY, no --bare in the script or workflow, the doc's inert-until sentence) were each seen red on 2026-10-28.
    status: verified
    release: 0.41.0
    method: automated-test
    test-location: scripts/factory-report.py
    links:
      - type: verifies
        target: REQ-FACTORY-REPORT-INSTRUMENT-GATE

  - id: REQ-RELEASE-DOCS-ARCHIVE-RULE
    type: requirement
    title: Every tool's release publishes a docs archive inside its signed SHA256SUMS
    description: >-
