  - id: REQ-PR-ADMISSION
    type: requirement
    title: An agent checks the repo's CI queue before opening a PR
    description: >-
      On 2026-10-28 agents had opened 53 PRs org-wide by 07:00 UTC, many of them one-line docs edits, while all 14 self-hosted runners were busy, 272 jobs were queued in 35 runs and 105 hosted jobs were queued. Nothing told an agent to look at the queue before opening a PR. The ci-status skill gains a "Before opening a PR" section and a description that triggers on opening a pull request. It classifies the change as docs, fix, feature, security or red-main; security and red-main always open. It asks warte's /api/admission and /api/queue through PULSEENGINE_WARTE_URL (with PULSEENGINE_WARTE_CACERT for its private CA) first, states that those endpoints are requested in pulseengine/warte#55 and do not exist yet, and treats unset, unreachable or 404 as not available. The second source is the fleet status API's /api/state snapshot (the repo's queued runs and the shared pools), whose response schema is not published, so a missing field falls through. The last is GitHub's per-repo queued-run count via gh api, with the note that it cannot see the shared self-hosted pool. Fallback thresholds, stated as starting values: docs batch when the repo has 1 or more queued runs or the session already has an open PR there; fix and feature hold when it has 5 or more. A batch goes onto the session's own PR (a branch it recorded, never found by author, never another session's); a hold is committed locally and recorded in pending_gates or the working context until it is opened. No host or certificate path is written into the plugin.
    status: verified
    release: 0.43.0
    category: functional
    priority: should
    fields:
      category: functional

