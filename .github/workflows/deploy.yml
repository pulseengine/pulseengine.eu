name: Deploy

# Release variant — never cancel a deploy mid-flight. A cancelled deploy
# can leave the Netcup site in a half-deleted state (the script does
# `find . -delete && tar -xzf`). Group by ref so two parallel pushes to
# the same branch serialize cleanly without race-deleting each other.
#
# Security note: this concurrency block uses only server-controlled
# context vars (github.ref, github.workflow) — no PR-author-controlled
# input flows into the group key.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [compliance-report-updated]

jobs:
  deploy:
    # On `light`, not `rust-cpu`. Measured 2026-10-21 over the last 22 deploys
    # and 25 CI runs: deploys on rust-cpu waited a median 17.9 min to start,
    # p90 41 hours, worst 7.5 days, because that pool is shared with every
    # repo's Rust CI. CI on light started in a median 0.1 min. Only one step here
    # needs Rust (fetch-reports, a small pure-Rust tool, cached), and a published
    # post or a fix to a live page should not queue behind another repo's build.
    # ci.yml's `deploy-tooling` job proves on every PR that this pool can build
    # fetch-reports and has every binary this job calls.
    runs-on: [self-hosted, linux, x64, light]
    # Fail fast instead of hanging: a stuck deploy (e.g. a wedged scp) must not
    # hold the release-${{ github.ref }} concurrency slot for the 6h default and
    # jam every later deploy. 15 min is generous for a build + tar + scp.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Zola is pinned BY PATH, not by PATH lookup. On self-hosted runners an
      # old zola (Tera v1) earlier on PATH shadowed the pinned one: the install
      # step printed `zola 0.23.6`, then the bare `zola build` rejected the Tera
      # v2 templates on main and ejected PR #298 from the merge queue (run
      # 40843089563; pulseengine/smithy#43). So the binary lands in a job-local
      # directory, is checked against a pinned sha256, and every call uses
      # "$ZOLA" — never a bare `zola`.
      #
      # ZOLA_SHA256 is the release asset's `digest` for
      # zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz (the release ships no
      # SHA256SUMS file), from https://github.com/getzola/zola/releases/tag/v0.23.6
      # via `gh api repos/getzola/zola/releases/tags/v0.23.6 --jq '.assets[].digest'`,
      # re-hashed locally on 2026-10-29. musl: static, so runner glibc drift
      # cannot break it, and it is the asset CI ran before this pin.
      - name: Install Zola (pinned by path and sha256)
        env:
          ZOLA_VERSION: 0.23.6
          ZOLA_SHA256: 7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zola-$ZOLA_VERSION"
          asset="zola-v$ZOLA_VERSION-x86_64-unknown-linux-musl.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/$asset"
          echo "$ZOLA_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" zola
          got=$("$dir/zola" --version)
          if [ "$got" != "zola $ZOLA_VERSION" ]; then
            echo "::error::pinned zola reports '$got', expected 'zola $ZOLA_VERSION'"
            exit 1
          fi
          echo "ZOLA=$dir/zola" >> "$GITHUB_ENV"
          echo "ZOLA_VERSION=$ZOLA_VERSION" >> "$GITHUB_ENV"

      - name: Inject git info into blog posts
        run: python3 scripts/inject-git-info.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache fetch-reports build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fetch-reports/target
          key: fetch-reports-${{ hashFiles('tools/fetch-reports/Cargo.lock') }}

      - name: Fetch compliance reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --release --manifest-path tools/fetch-reports/Cargo.toml

      # Refreshes static/layers.json from ghcr.io. A registry hiccup is not fatal:
      # the script keeps the committed snapshot and the page reports its age
      # (pulseengine.eu#201 — a stale panel must say so rather than look current).
      # Surfaces projects that stopped attaching a report asset. Deliberately
      # non-blocking: whether an upstream release carries a report is not this
      # repository's to control, and a site that cannot deploy because another
      # repo changed its release workflow would be worse than a stale figure.
      - name: Report which projects stopped publishing evidence
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-report-freshness.py

      # fetch-reports records every release that carried a report asset, but
      # does not check the extracted bundle contains the file the page links to.
      # Bundles are not uniform — scry ships no HTML at all — so without this
      # every scry link was a 404 and six old witness versions were dead.
      - name: Drop report versions whose entry file is missing
        run: python3 scripts/prune-report-versions.py

      - name: Fetch varve layer metadata
        run: python3 scripts/fetch-layers.py

      # The hero evidence panel (pulseengine.eu#201). Runs after
      # fetch-layers so it reads the layer index this deploy fetched. Same pinned
      # rivet as ci.yml. Deliberately non-blocking: a tile whose source is
      # missing renders "unavailable", which is the designed fallback, so a
      # rivet download hiccup must not stop a deploy. The generator never reads
      # a previous evidence.json, so nothing old is carried forward.
      - name: Install rivet
        continue-on-error: true
        run: |
          set -euo pipefail
          VER=v0.39.0
          ASSET="rivet-$VER-x86_64-unknown-linux-gnu.tar.gz"
          rm -rf /tmp/rivet-bin && mkdir -p /tmp/rivet-bin "$HOME/.local/bin"
          curl -fsSL --retry 3 -o /tmp/rivet.tar.gz \
            "https://github.com/pulseengine/rivet/releases/download/$VER/$ASSET"
          tar xzf /tmp/rivet.tar.gz -C /tmp/rivet-bin
          BIN=$(find /tmp/rivet-bin -type f -name rivet | head -1)
          test -n "$BIN"
          install -m 0755 "$BIN" "$HOME/.local/bin/rivet"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rivet" --version

      - name: Measure the hero evidence panel
        run: python3 scripts/build-evidence.py

      - name: Inject build info
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          sed -i "s|<!-- BUILD_INFO -->|· <a href=\"${COMMIT_URL}\">${SHORT_SHA}</a> · <a href=\"${RUN_URL}\">deploy #${GITHUB_RUN_NUMBER}</a>|" templates/base.html

      # Re-asserts the pinned binary immediately before building, and reports
      # any other zola on PATH at this point: later steps prepend to PATH (the
      # rivet install adds ~/.local/bin), so a check at install time would see
      # a clean PATH. The warning is diagnostics for pulseengine/smithy#43; the
      # build never uses PATH lookup.
      - name: Build
        run: |
          set -euo pipefail
          : "${ZOLA:?ZOLA is not set; the pinned install step did not run}"
          got=$("$ZOLA" --version)
          if [ "$got" != "zola $ZOLA_VERSION" ]; then
            echo "::error::$ZOLA reports '$got', expected 'zola $ZOLA_VERSION'"
            exit 1
          fi
          if other=$(command -v zola); then
            if [ "$other" != "$ZOLA" ]; then
              echo "::warning::another zola is on PATH and is NOT used: $other ($("$other" --version 2>&1 || true)); all on PATH: $(type -ap zola | xargs)"
            fi
          fi
          "$ZOLA" build

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Always remove the key, even if a later step fails.
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh-keyscan -T 20 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Fail fast instead of hanging on a wedged connection:
          #  - BatchMode: never block on a prompt
          #  - ConnectTimeout: give up if the TCP connect stalls
          #  - ServerAlive*: abort if the session goes dead mid-transfer (~60s)
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # Package site into a tarball
          tar -czf site.tar.gz -C public .

          # Upload tarball
          scp -i ~/.ssh/deploy_key $SSH_OPTS "site.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/site.tar.gz"

          # Extract on remote, replacing old content
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "
            cd ${DEPLOY_PATH} &&
            find . -mindepth 1 -not -name site.tar.gz -delete 2>/dev/null;
            tar -xzf site.tar.gz &&
            rm site.tar.gz
          "

          rm -f ~/.ssh/deploy_key
