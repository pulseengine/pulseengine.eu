name: Deploy

# Release variant — never cancel a deploy mid-flight. A cancelled deploy
# can leave the Netcup site in a half-deleted state (the script does
# `find . -delete && tar -xzf`). Group by ref so two parallel pushes to
# the same branch serialize cleanly without race-deleting each other.
#
# Security note: this concurrency block uses only server-controlled
# context vars (github.ref, github.workflow) — no PR-author-controlled
# input flows into the group key.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [compliance-report-updated]

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # Fail fast instead of hanging: a stuck deploy (e.g. a wedged scp) must not
    # hold the release-${{ github.ref }} concurrency slot for the 6h default and
    # jam every later deploy. 15 min is generous for a build + tar + scp.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Inject git info into blog posts
        run: python3 scripts/inject-git-info.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache fetch-reports build
        uses: actions/cache@v6
        with:
          path: tools/fetch-reports/target
          key: fetch-reports-${{ hashFiles('tools/fetch-reports/Cargo.lock') }}

      - name: Fetch compliance reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --release --manifest-path tools/fetch-reports/Cargo.toml

      - name: Inject build info
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          sed -i "s|<!-- BUILD_INFO -->|· <a href=\"${COMMIT_URL}\">${SHORT_SHA}</a> · <a href=\"${RUN_URL}\">deploy #${GITHUB_RUN_NUMBER}</a>|" templates/base.html

      - name: Build
        run: zola build

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Always remove the key, even if a later step fails.
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh-keyscan -T 20 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Fail fast instead of hanging on a wedged connection:
          #  - BatchMode: never block on a prompt
          #  - ConnectTimeout: give up if the TCP connect stalls
          #  - ServerAlive*: abort if the session goes dead mid-transfer (~60s)
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # Package site into a tarball
          tar -czf site.tar.gz -C public .

          # Upload tarball
          scp -i ~/.ssh/deploy_key $SSH_OPTS "site.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/site.tar.gz"

          # Extract on remote, replacing old content
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "
            cd ${DEPLOY_PATH} &&
            find . -mindepth 1 -not -name site.tar.gz -delete 2>/dev/null;
            tar -xzf site.tar.gz &&
            rm site.tar.gz
          "

          rm -f ~/.ssh/deploy_key
