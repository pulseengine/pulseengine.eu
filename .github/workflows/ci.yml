name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v7

      - name: Install Zola
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: zola@0.22.1

      - name: Build
        run: zola build

      # `zola build` does not validate links, and `zola check
      # --skip-external-links` only understands Zola's `@/path.md` syntax —
      # measured: it exits 0 with a deliberately dead `/docs/guide/compliance/`
      # in content/docs/_index.md. Our content uses raw absolute hrefs, so that
      # gate would be vacuous. This one is not: six dead links were live on the
      # site when it was added, four of them on the nav-linked /docs/ page.
      - name: Check internal links
        run: python3 scripts/check-internal-links.py
