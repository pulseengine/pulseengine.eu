name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
  # GitHub merge queue: `build` is the required context, so this workflow must
  # also run on the queue's merge_group event, or a queued PR waits on a check
  # nothing reports until the queue's timeout evicts it. Both jobs run in the
  # queue exactly as on a PR: they are cheap, and the queue commit is what
  # lands. Concurrency: head_ref is empty in a queue run and github.ref is the
  # entry's own gh-readonly-queue ref, so entries never cancel each other.
  merge_group:

jobs:
  build:
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      # Full history: check-plugin-version-current.py finds the commit that set
      # the version with `git log -S`. On the default depth-1 checkout it found
      # the PR's own merge commit and passed vacuously (#315); it now exits 2
      # on a shallow clone, so this depth is what lets it run at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Zola is pinned BY PATH, not by PATH lookup. On self-hosted runners an
      # old zola (Tera v1) earlier on PATH shadowed the pinned one: the install
      # step printed `zola 0.23.6`, then the bare `zola build` rejected the Tera
      # v2 templates on main and ejected PR #298 from the merge queue (run
      # 40843089563; pulseengine/smithy#43). So the binary lands in a job-local
      # directory, is checked against a pinned sha256, and every call uses
      # "$ZOLA" — never a bare `zola`.
      #
      # ZOLA_SHA256 is the release asset's `digest` for
      # zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz (the release ships no
      # SHA256SUMS file), from https://github.com/getzola/zola/releases/tag/v0.23.6
      # via `gh api repos/getzola/zola/releases/tags/v0.23.6 --jq '.assets[].digest'`,
      # re-hashed locally on 2026-10-29. musl: static, so runner glibc drift
      # cannot break it, and it is the asset CI ran before this pin.
      - name: Install Zola (pinned by path and sha256)
        env:
          ZOLA_VERSION: 0.23.6
          ZOLA_SHA256: 7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zola-$ZOLA_VERSION"
          asset="zola-v$ZOLA_VERSION-x86_64-unknown-linux-musl.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/$asset"
          echo "$ZOLA_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" zola
          got=$("$dir/zola" --version)
          if [ "$got" != "zola $ZOLA_VERSION" ]; then
            echo "::error::pinned zola reports '$got', expected 'zola $ZOLA_VERSION'"
            exit 1
          fi
          echo "ZOLA=$dir/zola" >> "$GITHUB_ENV"
          echo "ZOLA_VERSION=$ZOLA_VERSION" >> "$GITHUB_ENV"

      # The V for the gates themselves. rivet is pinned to an exact release,
      # not "latest", so CI and a local run agree — a project that validates
      # on one version and runs another is the same shape as a gate that
      # passes against the wrong instrument. v0.43.0 is the first release with
      # `allowed-values-severity`, which schemas/north-star.yaml needs; 0.39.0
      # refuses to load that schema. Bump VER and RIVET_SHA256 together here,
      # in deploy.yml and in release.yml.
      # RIVET_SHA256 is the x86_64-unknown-linux-gnu line of the release's
      # SHA256SUMS.txt, taken after `cosign verify-blob` accepted SHA256SUMS
      # as signed by rivet's .github/workflows/release.yml@refs/tags/v0.43.0
      # (GitHub OIDC). The check below refuses any other bytes.
      # curl, not `gh`: the self-hosted runners do not have the GitHub CLI.
      # Measured the hard way — the first version of this step died on
      # `gh: command not found`, which is the same thing that made the report
      # freshness check silently examine nothing (#214). The release asset is
      # public, so no token is needed.
      - name: Install rivet
        env:
          RIVET_SHA256: b3681544f1a49d9ec71ba271daa8de1f45e50a8a1362370ca068603b8a94f22c
        run: |
          set -euo pipefail
          VER=v0.43.0
          ASSET="rivet-$VER-x86_64-unknown-linux-gnu.tar.gz"
          rm -rf /tmp/rivet-bin && mkdir -p /tmp/rivet-bin "$HOME/.local/bin"
          curl -fsSL --retry 3 -o /tmp/rivet.tar.gz \
            "https://github.com/pulseengine/rivet/releases/download/$VER/$ASSET"
          echo "$RIVET_SHA256  /tmp/rivet.tar.gz" | sha256sum -c -
          tar xzf /tmp/rivet.tar.gz -C /tmp/rivet-bin
          BIN=$(find /tmp/rivet-bin -type f -name rivet | head -1)
          test -n "$BIN"
          install -m 0755 "$BIN" "$HOME/.local/bin/rivet"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rivet" --version

      # The hero evidence panel (pulseengine.eu#201) is measured, not typed:
      # build-evidence.py writes data/evidence.json and the homepage renders it.
      # Measured here, before Build, so the PR build renders the real panel and
      # the generator runs against the pinned rivet the deploy also installs.
      # --require: claim-check and rivet run from this checkout, so if either
      # comes out unavailable here it is a broken generator, not a flaky
      # source. The layer tile may legitimately be stale or missing
      # on a PR (no ghcr fetch), and renders so.
      - name: Check the evidence panel's generator can still fail
        run: python3 scripts/build-evidence.py --self-test

      - name: Measure the hero evidence panel
        run: python3 scripts/build-evidence.py --require claims,rivet

      # Re-asserts the pinned binary immediately before building, and reports
      # any other zola on PATH at this point: later steps prepend to PATH (the
      # rivet install adds ~/.local/bin), so a check at install time would see
      # a clean PATH. The warning is diagnostics for pulseengine/smithy#43; the
      # build never uses PATH lookup.
      - name: Build
        run: |
          set -euo pipefail
          : "${ZOLA:?ZOLA is not set; the pinned install step did not run}"
          got=$("$ZOLA" --version)
          if [ "$got" != "zola $ZOLA_VERSION" ]; then
            echo "::error::$ZOLA reports '$got', expected 'zola $ZOLA_VERSION'"
            exit 1
          fi
          if other=$(command -v zola); then
            if [ "$other" != "$ZOLA" ]; then
              echo "::warning::another zola is on PATH and is NOT used: $other ($("$other" --version 2>&1 || true)); all on PATH: $(type -ap zola | xargs)"
            fi
          fi
          "$ZOLA" build

      # The site self-hosts every script, stylesheet and font (no CDN). The
      # Playwright watchdog in tests/playwright is not run by any job, and
      # Google Fonts plus a floating mermaid@11 from jsdelivr were live until
      # this check landed. The control plants a CDN script and must go red.
      - name: No third-party loads in the built site
        run: |
          set +e
          bash scripts/check-no-third-party.sh public
          rc=$?
          [ "$rc" -eq 0 ] || exit "$rc"
          ctl="$RUNNER_TEMP/third-party-control"
          mkdir -p "$ctl"
          printf '<script src="https://cdn.jsdelivr.net/npm/x@1/x.js"></script>\n' > "$ctl/index.html"
          bash scripts/check-no-third-party.sh "$ctl" >/dev/null
          if [ $? -ne 1 ]; then echo "control: a planted CDN script was not caught"; exit 1; fi
          echo "control: planted CDN script caught"

      # `zola build` does not validate links, and `zola check
      # --skip-external-links` only understands Zola's `@/path.md` syntax —
      # measured: it exits 0 with a deliberately dead `/docs/guide/compliance/`
      # in content/docs/_index.md. Our content uses raw absolute hrefs, so that
      # gate would be vacuous. This one is not: six dead links were live on the
      # site when it was added, four of them on the nav-linked /docs/ page.
      - name: Check internal links
        run: python3 scripts/check-internal-links.py

      # A published post must not link to a draft — CI builds without
      # --drafts, so the link is dead. The auto-publish cron flips draft
      # to false one post at a time; this gate catches forward links
      # before they reach production.
      - name: Check no links to draft posts
        run: python3 scripts/check-draft-links.py

      # The marketplace manifest is the storefront an outsider's `/plugin
      # install` reads, and nothing else validates it. Measured 2026-08-26: it
      # advertised v0.12.0 / "fourteen procedural skills" while the plugin was
      # v0.25.0 with sixteen — thirteen minor versions of silent drift. The
      # cache keys on plugin.json, so this never failed anything; it was just
      # wrong. Now it fails here.
      - name: Check the plugin marketplace manifest
        run: python3 scripts/check-plugin-manifest.py

      # The plugin attributes claims to blog posts by slug. A citation is prose,
      # not a link, so the link checker never sees it — deleting two drafts in
      # #169 left four citations pointing at files that no longer existed, and
      # nothing noticed for eleven days.
      - name: Check plugin post citations resolve
        run: python3 scripts/check-post-citations.py

      # Mermaid compiles classDef into the SVG, where outer CSS cannot reach it,
      # so light mode is done by rewriting known dark hexes at runtime. A diagram
      # using a surface colour the patcher does not know renders dark-on-dark.
      - name: Check mermaid diagrams can render in light mode
        run: python3 scripts/check-mermaid-light-mode.py

      # `claude plugin validate` checks the manifests, not skill frontmatter,
      # so nothing here looked at descriptions. Two skills sat 11 and 35 chars
      # over the 1024 limit until GitHub Copilot CLI refused to LOAD them —
      # not a warning, the skills simply were not there.
      - name: Check skill frontmatter loads in agent runtimes
        run: python3 scripts/check-skill-frontmatter.py

      # check-plugin-manifest keeps the manifests' spelled-out skill COUNT
      # honest, but only the README says what each skill DOES — and nothing
      # checked it. The roster drifted to 14 of 18 (evidence-transfer,
      # gate-potency, repo-hygiene, verify-your-own-claims: installed,
      # loadable, triggering, undocumented) and the count check could not see
      # it. Both directions, derived from disk so it needs no maintenance.
      - name: Check the README documents every installed skill
        run: python3 scripts/check-readme-skill-roster.py

      # The layer view builds its whole DOM in JavaScript, so a class the script
      # emits and the stylesheet does not define renders unstyled and nothing
      # else notices. Porting the prototype into the site produced six such
      # defects, all of which built cleanly; this gate catches each of them.
      - name: Check the layer view's classes are styled
        run: python3 scripts/check-layers-view.py

      # No new Python (plugin core contract, owner 2026-11-18). The tracked .py
      # files are frozen in scripts/python-frozen.txt: a new one fails here, and
      # a ported one must leave the list, so the list only shrinks.
      - name: No new Python (frozen list only shrinks)
        run: |
          # C collation on both sides: the list was once sorted under a UTF-8
          # locale and comm refused it ("not in sorted order").
          export LC_ALL=C
          git ls-files '*.py' | sort > "$RUNNER_TEMP/py-now.txt"
          sort -c scripts/python-frozen.txt || { echo "::error::scripts/python-frozen.txt is not in C sort order (LC_ALL=C sort it)"; exit 1; }
          new=$(comm -23 "$RUNNER_TEMP/py-now.txt" scripts/python-frozen.txt)
          gone=$(comm -13 "$RUNNER_TEMP/py-now.txt" scripts/python-frozen.txt)
          if [ -n "$new" ]; then echo "::error::new Python files (write Rust instead):"; echo "$new"; exit 1; fi
          if [ -n "$gone" ]; then echo "::error::ported or removed, drop from scripts/python-frozen.txt:"; echo "$gone"; exit 1; fi
          echo "python files: $(wc -l < scripts/python-frozen.txt) (frozen)"

      # data/north-star.toml feeds the /north-star page, every repo's `serves:`
      # allowed-values list and the indicator scripts. The check holds the
      # honesty rules (a guard per objective, "unmeasured" instead of a made-up
      # zero, no date on the goal) and keeps infrastructure detail out.
      - name: Check the North Star data (negative controls first)
        run: |
          python3 scripts/check-north-star.py --self-test
          python3 scripts/check-north-star.py

      # data/lean-pins.toml is the Lean toolchain policy (stable only, at most N
      # minors behind the org target, expiring exceptions). The live check runs
      # weekly in lean-pins.yml; here only the decision table, so a PR cannot
      # break the rules' logic unnoticed.
      - name: Check the Lean pin policy's decision table
        run: python3 scripts/check-lean-pins.py --self-test

      # The host sends no Cache-Control, only ETag/Last-Modified, so a browser
      # caches heuristically and does not revalidate. A reader got the new
      # /layers HTML and JS against a main.css from days earlier and saw an
      # unstyled page. cachebust=true puts a content hash in the URL.
      - name: Check static assets are cache-busted
        run: python3 scripts/check-asset-cachebust.py

      # The plugin installs by version and the cache keys on it, so two trees
      # carrying the same version are indistinguishable to anyone who already
      # installed the first. check-plugin-manifest keeps the two manifests in
      # step with each other; they can do that while both are stale.
      - name: Check the plugin version tracks its content
        run: python3 scripts/check-plugin-version-current.py

      # --strict-empty is the point: without it a config typo that loads zero
      # artifacts reports n/a for every rule and historically 100% overall, so
      # the gate passes by examining nothing.
      - name: Check the gates' own traceability
        run: |
          rivet validate
          rivet coverage --tests --scan-paths scripts --strict-empty

      # schemas/north-star.yaml is the canonical rivet fragment every repo uses
      # for a feature's `serves:`; its allowed-values must be exactly the
      # objective ids in data/north-star.toml. Planted control on every run: a
      # copy with an extra O9 must fail with exit 1 (drift), not pass and not
      # exit 2 (parse failure), or the check is not seeing the list.
      # rivet: verifies REQ-NORTH-STAR-SERVES
      - name: North Star schema matches the objectives (planted O9 must fail)
        run: |
          set -euo pipefail
          bash scripts/check-north-star-serves.sh
          planted="$RUNNER_TEMP/north-star-o9.yaml"
          sed 's/^\( *allowed-values: \[.*\)\]/\1, O9]/' schemas/north-star.yaml > "$planted"
          grep -q 'allowed-values: \[.*, O9\]' "$planted"
          rc=0
          bash scripts/check-north-star-serves.sh data/north-star.toml "$planted" || rc=$?
          if [ "$rc" != "1" ]; then
            echo "::error::planted O9 control: expected exit 1 (drift), got $rc"
            exit 1
          fi
          echo "planted O9 control failed as expected (exit 1)"

      # The fragment bites: run against the fixtures with --schemas schemas, so
      # the file under test is the canonical one, not a copy. serves: O2 and
      # serves: [O1, O5] must validate; serves: O9 must fail with an ERROR
      # naming the field and value.
      - name: North Star schema accepts objective ids and rejects O9
        run: |
          set -euo pipefail
          rivet --project tests/north-star-serves/pass --schemas schemas validate
          out="$RUNNER_TEMP/north-star-serves-fail.txt"
          rc=0
          rivet --project tests/north-star-serves/fail --schemas schemas validate > "$out" 2>&1 || rc=$?
          cat "$out"
          if [ "$rc" = "0" ]; then
            echo "::error::serves: O9 passed rivet validate"
            exit 1
          fi
          grep -F "ERROR: [FEAT-SERVES-UNKNOWN] field 'serves' has value 'O9'" "$out"

      # The plugin's load-bearing claims, bound to re-derivable evidence
      # (pulseengine.eu#202). We ship the claim-verification skill and were one
      # of three repos in four not using it; this runs its own reference
      # implementation against our own ledger.
      # The checker's own logic first. set-equal and count-equals must fail on an
      # empty side and in both directions (pulseengine.eu#198); a checker only
      # ever seen to pass is indistinguishable from one that cannot fail.
      - name: Check the claim checker can still fail
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/claim-verification/claim-check.py --self-test

      - name: Check the plugin's claims still hold
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/claim-verification/claim-check.py claims.yaml

      # The friction x model harness (docs/experiments/2026-10-friction-x-model.md):
      # the loop, the argv, hidden-file isolation, the frozen harnesses and the
      # decision rules, with a stub model. No API call, no toolchain.
      - name: Check the friction x model harness
        run: python3 experiments/friction-x-model/fxm.py self-test

      # The v2 (brownfield) acceptance checks' pure parts: edit derive/apply,
      # the feature-marker split, missing-name and literal parsers. No toolchain.
      - name: Check the friction brownfield acceptance checks
        run: python3 experiments/friction-brownfield/check_task.py self-test

      # Noise budgets are fixed before a task's first authoring round and
      # frozen after it (owner decision 2026-10-30); read from git history,
      # which this job has (fetch-depth 0).
      - name: Check the friction brownfield noise budgets are frozen
        run: python3 experiments/friction-brownfield/check_task.py budgets

      # The issue-hunt backlog brake's decision table (REQ-ISSUE-CLASS-RATCHET).
      # It lives here, in `build`, because `build` is the only context branch
      # protection actually requires — a job in its own path-filtered workflow
      # cannot be made required without every unrelated PR waiting forever for a
      # status that never reports. The table needs no network, so it belongs on
      # the PR; the live tracker check is scheduled in issue-classes.yml, since
      # queue state drifts with no PR involved.
      - name: Check the backlog brake can still fail
        run: python3 scripts/check-issue-classes.py --self-test

      # The blog cron's publish verdict (REQ-BLOG-AUTOPUBLISH-NO-VACUOUS-GREEN).
      # The cron runs on a schedule, so a PR is the only place its decision
      # logic is exercised before it decides about a real post. The table
      # includes the 2026-11-03 reading of #335 (CLOSED, auto-merge still
      # showing), which the old logic called pending; a due post linking to a
      # draft must be held back, and every due, unpublished post must appear
      # in the status report as an error. Offline.
      - name: Check the blog cron cannot report a closed publish PR as pending
        run: python3 scripts/blog-autopublish.py --self-test

      # The monthly factory report's instrument gate (REQ-FACTORY-REPORT-
      # INSTRUMENT-GATE). The report job is scheduled and needs a secret, so its
      # gating logic would otherwise only ever be exercised once a month, by a
      # paid run. Here, on every PR: low precision or recall fails, nothing is
      # written on a failure, and a missing key skips with exit 0. Offline; the
      # SDK request-shape cases skip without the SDK and run in the job itself.
      - name: Check the factory report's instrument gate can still fail
        run: python3 scripts/factory-report.py --self-test

      # The factory notice inbox's answer-safety rules (REQ-FACTORY-NOTICE-
      # ANSWER-SAFETY). An answer is an instruction and a row in warte is not
      # proof the owner wrote it, so the rejection cases (option not offered, stale revision,
      # second answer, unknown id, forged warte notice) run on every PR. Offline:
      # the warte client runs against an in-process stub on the loopback.
      - name: Check the factory notice inbox rejects unsafe answers
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/factory-notice/notice.py --self-test

      # skill-usage.py reads private transcripts: its self-test proves it prints
      # aggregates only (a canary in the fixture prompts must never surface) and
      # that its skill-usage.v1 report validator and warte post can fail.
      - name: Check the skill-usage report prints aggregates only
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/capture-session-learnings/skill-usage.py --self-test

      # The incident ledger (REQ-INCIDENT-LEDGER): rate math, attribution and the
      # closure rule on fixtures, then the curated ledger itself. Both offline.
      # The org-wide sweep needs the API, so it is run by hand and its report is
      # committed as a dated snapshot; it is not a PR check.
      - name: Check the incident ledger's math and attribution can still fail
        run: python3 scripts/incident-ledger.py --self-test

      # Cause classes for escapes: evidence gathering from canned API data, the
      # class-list and schema checks, and a negative control (a fix that only
      # adds a test is classed exactly as the canned model answers; an invalid
      # class fails the run). No credential, no network.
      - name: Check the incident cause classifier refuses answers outside its classes
        run: python3 scripts/incident-causes.py --self-test

      - name: Check the incident ledger closes entries only on a negative control
        run: python3 scripts/incident-ledger.py check-ledger

      # The seam-contract checker (REQ-SEAM-CONTRACT-CHECK). Offline: one
      # negative control per rule must exit 1 with that rule named, API
      # failures must exit 2 (the real curl and urllib paths run against a
      # loopback stub, comment pagination included), and the pilot run checks
      # the four drone-seam blocks, as posted on jess#62, jess#167, relay#572 and
      # relay#589 on 2026-10-29, against relay and jess files fetched that day:
      # all four must pass, and the same relay#589 block with the issue's old
      # @0.11.0 must go red on interface-version (the drift the pilot found).
      # The live check against GitHub is seam-check.yml, not a PR check.
      - name: Check the seam-contract checker can still fail
        run: |
          set -euo pipefail
          S=claude-tooling/plugins/pulseengine-claude/skills/seam-contract/seam-check.py
          P=tests/seam-contract/pilot
          python3 "$S" --self-test
          rc=0
          python3 "$S" --fixtures "$P" --now 2026-10-29 --format json > "$RUNNER_TEMP/pilot.json" || rc=$?
          sed 's/version: "0\.12\.0"/version: "0.11.0"/' "$P/blocks/relay-589.md" > "$RUNNER_TEMP/drift.md"
          drc=0
          python3 "$S" --fixtures "$P" --block "$RUNNER_TEMP/drift.md" --now 2026-10-29 --format json \
            > "$RUNNER_TEMP/drift.json" || drc=$?
          python3 - "$RUNNER_TEMP/pilot.json" "$rc" "$RUNNER_TEMP/drift.json" "$drc" <<'PY'
          import json, sys
          def failing(path):
              r = json.load(open(path))
              return r, {s["id"]: sorted({v["rule"] for v in s["violations"]}) for s in r["seams"] if s["violations"]}
          r, pilot = failing(sys.argv[1])
          _, drift = failing(sys.argv[3])
          want = {"relay-jess/estimator-identity": ["interface-version"]}
          ok = sys.argv[2] == "0" and len(r["seams"]) == 4 and pilot == {}
          ok = ok and sys.argv[4] == "1" and drift == want
          print("pilot: exit %s, %d seams, failing %s; drift control: exit %s, failing %s"
                % (sys.argv[2], len(r["seams"]), pilot, sys.argv[4], drift))
          sys.exit(0 if ok else 1)
          PY

      # The SessionStart hook that writes `setopt no_nomatch no_equals` into
      # $CLAUDE_ENV_FILE (REQ-HOOK-ZSH-SHELL-OPTIONS). Runs the real hook and the
      # real zsh: plain zsh must still fail `echo ===` and an unmatched glob
      # (else the check is vacuous), zsh after the file must not, the line is
      # written once, and bash sourcing it is a no-op. The test exits 2 without
      # zsh rather than skip, so a runner without it goes red, not green.
      # The self-hosted runners have no zsh and no sudo, so it is unpacked from
      # the distribution's own signed package into $RUNNER_TEMP (apt-get
      # download + dpkg -x need no root); `zsh -f` needs only the binary.
      - name: Check the zsh shell-options hook
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null; then
            d="$RUNNER_TEMP/zsh-pkg"
            mkdir -p "$d"
            ( cd "$d" && apt-get download zsh >/dev/null 2>&1 ) \
              || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq zsh; } >/dev/null 2>&1 \
              || { echo "::error::zsh is not installed and could not be fetched"; exit 2; }
            if ls "$d"/zsh_*.deb >/dev/null 2>&1; then
              dpkg -x "$d"/zsh_*.deb "$d/root"
              bin=$(find "$d/root" -type f -name 'zsh*' -perm -u+x -path '*/bin/*' | head -n 1)
              mkdir -p "$d/bin"
              ln -sf "$bin" "$d/bin/zsh"
              export PATH="$d/bin:$PATH"
            fi
          fi
          python3 scripts/check-hook-shell-options.py

      # The PreToolUse(Agent) hook that reminds the agent to choose `model:`
      # (REQ-AGENT-MODEL-REMINDER). Runs the real wrapper: it must fire on an
      # Agent call that would inherit the parent's model, stay silent on every
      # other case (model set, fork, Explore, plugin agents, bad input), and
      # never print anything but additionalContext or exit non-zero, so it can
      # never deny, approve or rewrite a call.
      - name: Check the Agent model-reminder hook never blocks
        run: |
          set -euo pipefail
          python3 scripts/check-agent-model-reminder.py

      # The Bash loop guard (REQ-LOOP-GUARD): the 3rd identical failure of one
      # command says so, a success resets it, and it never prints a permission
      # decision or exits non-zero.
      - name: Check the loop-guard hook never blocks
        run: |
          set -euo pipefail
          python3 scripts/check-loop-guard.py

      # The PreToolUse(Bash) disk-pressure hook (REQ-DISK-PRESSURE). Runs the
      # real wrapper with a fake warte probe: it must name the holders on a low
      # or critical volume, never call the probe with --measure, treat a stale,
      # empty or failing answer as not available, and never print a permission
      # decision or exit non-zero.
      - name: Check the disk-pressure hook never blocks
        run: |
          set -euo pipefail
          python3 scripts/check-disk-pressure.py

      # The PreToolUse(Bash) commit-merge-guard hook (REQ-COMMIT-MERGE-GUARD).
      # Runs the real wrapper against throwaway git repos and a stub gh that
      # answers from fixtures. HOME, GIT_CONFIG_GLOBAL and the plugin data dir
      # are temp dirs and PATH is symlinks only, so the runner's own identity,
      # tokens and network never reach it. Must deny the synth INC-2026-10-006
      # identity and the smithy#45 --auto merge, allow protected and allow-listed
      # cases, warn rather than block on API failure, and stay silent elsewhere.
      # 0.50.0 (REQ-GUARDS-050) extends the same script: --admin and API
      # merges, red/pending direct merges, update-branch, unsigned commits and
      # identity writes, tags and publishes off green main, host-shaped commit
      # and PR text, PR admission advice, and the SessionStart signing probe.
      # The signing cases need a fixture outside every temp root, so the script
      # makes a .hookfix-* dir in the checkout and removes it.
      - name: Check the commit-merge-guard hook denies only what it should
        run: |
          set -euo pipefail
          python3 scripts/check-commit-merge-guard.py

      # The PreToolUse(Edit|Write|MultiEdit) private-host-guard hook
      # (REQ-GUARDS-050): asks on a host-shaped value written into a git repo,
      # silent for temp dirs, ~/.claude, non-repos, ignored files, allow-lists.
      - name: Check the private-host-guard hook asks only where it should
        run: |
          set -euo pipefail
          python3 scripts/check-private-host-guard.py

      # Rule 8 of the commit-merge-guard hook (REQ-CONFIDENTIAL-TERMS-GUARD):
      # a private terms file makes published text and pushed commits ask, by
      # line number only. A fixture word in a temp HOME; the repo ships no terms.
      - name: Check the confidential-terms ask names a line and nothing else
        run: |
          set -euo pipefail
          python3 scripts/check-confidential-terms.py

      # Claude Code delivers an additionalContext string over ~10k chars as a
      # ~2.3 KB preview; the methodology block was cut that way from June to
      # October 2026 and nothing noticed (REQ-CORE-CONTRACT-WHOLE). Runs every
      # hook in hooks.json under worst-case inputs; fails on any string over
      # 9,500 chars and on a core contract that arrives cut.
      - name: Check no hook hands Claude Code a context it would truncate
        run: |
          set -euo pipefail
          python3 scripts/check-hook-context-size.py

      # External review of #232 found a compiled .pyc in that PR and a second
      # one tracked for longer, with all ten gates green over both: each asked
      # whether a claim matched the tree, none asked what was in it.
      - name: Check no build artifact is tracked
        run: python3 scripts/check-no-build-artifacts.py

      # The plugin installs on other people's machines. 0.51.0 shipped an
      # absolute home-directory path in a memory file; the client-side guard
      # asks before one is written but never sees one already there.
      - name: Check the plugin ships no home-directory path
        run: python3 scripts/check-plugin-no-private-paths.py

      # Committed scripts get run on macOS, where /bin/bash is 3.2 and
      # /usr/bin/python3 is 3.9, while every step above runs newer tools — so
      # nothing caught a script that only works on those (REQ-SCRIPT-
      # PORTABILITY). Last in the job, and setup-python with
      # update-environment: false, so no step above runs on 3.9 by accident.
      # shellcheck is pinned like zola: sha256-checked into $RUNNER_TEMP and
      # called only as "$SHELLCHECK". SHELLCHECK_SHA256 is the release asset's
      # `digest` for shellcheck-v0.11.0.linux.x86_64.tar.gz from
      # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0, re-hashed
      # locally on 2026-10-29. .tar.gz, not .tar.xz: no xz needed.
      - name: Install shellcheck (pinned by path and sha256)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          asset="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$asset"
          echo "$SHELLCHECK_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          got=$("$dir/shellcheck" --version | sed -n 's/^version: //p')
          if [ "$got" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::pinned shellcheck reports '$got', expected '$SHELLCHECK_VERSION'"
            exit 1
          fi
          echo "SHELLCHECK=$dir/shellcheck" >> "$GITHUB_ENV"

      # Severity warning and up; info-level findings (SC2086 …) are not gated.
      - name: Check tracked shell scripts with shellcheck
        run: |
          set -euo pipefail
          : "${SHELLCHECK:?SHELLCHECK is not set; the pinned install step did not run}"
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r "$SHELLCHECK" -S warning

      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          update-environment: false

      # Under 3.9 the compile step is the real 3.9 parser; the AST pass catches
      # what parses on 3.9 but fails when it runs (unguarded tomllib, `X | None`
      # annotations without `from __future__ import annotations`, …). The
      # self-test first: a checker only ever seen to pass could not fail.
      - name: Check tracked Python runs on the 3.9 floor
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
        # update-environment: false also leaves LD_LIBRARY_PATH unset, and the
        # toolcache interpreter is linked against its own libpython: without
        # this it exits 127 ("libpython3.9.so.1.0: cannot open shared object
        # file"), measured on the light pool.
        run: |
          set -euo pipefail
          pylib="$(dirname "$(dirname "$PY39")")/lib"
          export LD_LIBRARY_PATH="$pylib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$PY39" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          "$PY39" scripts/check-py-floor.py --self-test
          git ls-files -z '*.py' | xargs -0 -r "$PY39" scripts/check-py-floor.py

  # Dog food (owner decision 2026-11-18): the North Star check rebuilt as a
  # WebAssembly component and run through PulseEngine's own chain. Every tool
  # (loom, wsc, meld, kiln, wasmtime) comes from the varve layer pinned in
  # varve.toml, installed into a job-local root. tools/north-star-check/
  # pipeline.sh builds, optimises, signs (a flipped byte must fail verify),
  # shows a mutant fails the comparison, then requires the Python script and
  # the component (plain, loom-optimised, signed) to agree on the committed
  # data, the 15 planted violations and 200 seeded random cases. The Python
  # step in `build` stays until the owner retires it.
  # rivet: verifies REQ-NORTH-STAR-COMPONENT
  north-star-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Job-local, never ~/.varve: on a persistent runner another repository's
      # newer layer leaves an anti-rollback mark that refuses this pin
      # (ordeal#322). RUNNER_TEMP is emptied after every job.
      - name: A fresh varve root for this job
        run: |
          echo "VARVE_ROOT=$RUNNER_TEMP/varve" >> "$GITHUB_ENV"
          echo "VARVE_INSTALL_DIR=$RUNNER_TEMP/varve/bin" >> "$GITHUB_ENV"

      - name: Install varve (cosign-verified) and the pinned layer
        env:
          VARVE_VERSION: v0.47.0
        run: bash scripts/install-varve.sh

      - name: The chain's tools resolve to the pinned layer
        run: |
          set -euo pipefail
          for t in wasmtime loom wsc meld kiln; do
            test "$(command -v "$t")" = "$VARVE_ROOT/shims/$t"
            "$VARVE_INSTALL_DIR/varve" which "$t"
          done

      - name: Rust with the wasm32-wasip2 target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip2
          rustup default stable

      - name: Build, optimise, sign and compare the North Star component
        env:
          FUZZ: "200"
        run: bash tools/north-star-check/pipeline.sh "$RUNNER_TEMP/north-star-check"

  # seam-check in Rust (owner decision 2026-11-19: no Python runtime for gates;
  # a python3 without PyYAML made seam-check.py exit 2 and block release tags).
  # tools/seam-check reads blocks with rivet's own parser (rivet-yaml, pinned
  # by rev). The equivalence harness runs seam-check.py (the reference, while
  # it exists) and the binary on every self-test case in text and JSON, the
  # drone-seam pilot, six real seam issues recorded 2026-11-19, CLI and YAML
  # edge cases and the HTTP path against a loopback stub, and requires the same
  # stdout and exit code. Two planted mutants of the Python script must each
  # break it (negative control), and the documented YAML 1.1/1.2 differences
  # must still differ. The harness fails, never skips, without PyYAML.
  # rivet: verifies REQ-SEAM-CHECK-RUST
  seam-check-rust:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache seam-check build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/seam-check/target
          key: seam-check-${{ runner.os }}-${{ hashFiles('tools/seam-check/Cargo.lock') }}

      - name: The reference interpreter has PyYAML
        run: python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Build seam-check
        run: cargo build --locked --release --manifest-path tools/seam-check/Cargo.toml

      - name: seam-check self-test
        run: tools/seam-check/target/release/seam-check --self-test

      - name: Equivalence with seam-check.py, negative controls included
        run: cargo test --locked --no-fail-fast --manifest-path tools/seam-check/Cargo.toml -- --show-output

  # The North Star consumer for O1, O3 and O5 (seam pulseengine.eu#393), run
  # monthly by north-star.yml. Offline here: one fixture per counting rule
  # (unsigned, wrong signer, tampered or unlisted input, missing asset, name
  # and objective disagreeing, schema violations, ran=false, a failed planted
  # control, a missing rung, gap_switch=true and the other O5 gate fields),
  # each required to move the result exactly as the rule says. cosign is a
  # stub with cosign's identity, issuer and digest semantics
  # (tests/cosign-stub.sh); the real-cosign test needs the network and runs
  # with --ignored. Negative control on every run: the suite is run again
  # against a counter that ignores ran=false, and one that ignores
  # control_failed_as_expected=false, and must fail at exactly those cases.
  # rivet: verifies REQ-NORTH-STAR-MEASURE
  north-star-measure:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache north-star-measure build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/north-star-measure/target
          key: north-star-measure-${{ runner.os }}-${{ hashFiles('tools/north-star-measure/Cargo.lock') }}

      - name: Build north-star-measure
        run: cargo build --locked --release --manifest-path tools/north-star-measure/Cargo.toml

      - name: Counting rules, negative controls included
        run: cargo test --locked --no-fail-fast --manifest-path tools/north-star-measure/Cargo.toml -- --show-output

  # Every committed Cargo.lock is audited and binds the build. Two planted
  # controls prove the job can fail: a lock with a known advisory must make
  # cargo audit exit non-zero, and a manifest edited past its lock must make
  # `cargo metadata --locked` refuse (fleet lockfile sweep, 2026-11-20).
  lockfiles:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install cargo-audit (pinned)
        run: cargo install --locked cargo-audit --version 0.22.1 --root "$RUNNER_TEMP/audit"

      - name: Every Cargo.toml has a committed lock that binds it
        run: |
          set -euo pipefail
          n=0
          for m in $(git ls-files '*Cargo.toml'); do
            d=$(dirname "$m")
            if ! git ls-files --error-unmatch "$d/Cargo.lock" >/dev/null 2>&1; then
              # a workspace member resolves through its workspace root's lock
              if cargo metadata --format-version 1 --no-deps --manifest-path "$m" 2>/dev/null \
                 | python3 -c 'import json,sys,os; d=json.load(sys.stdin); sys.exit(0 if os.path.isfile(os.path.join(d["workspace_root"],"Cargo.lock")) and os.path.dirname(os.path.abspath(sys.argv[1]))!=d["workspace_root"] else 1)' "$m"; then
                continue
              fi
              echo "MISSING lock for $m"; exit 1
            fi
            cargo metadata --locked --format-version 1 --manifest-path "$m" >/dev/null
            n=$((n+1))
          done
          echo "$n manifests bound by a committed lock"
          test "$n" -gt 0

      - name: cargo audit every committed lock
        run: |
          set -euo pipefail
          n=0
          for l in $(git ls-files '*Cargo.lock'); do
            # a fixture named *.Cargo.lock would match the glob; only real lockfiles count
            [ "$(basename "$l")" = "Cargo.lock" ] || { echo "not a lockfile, rename it: $l"; exit 1; }
            echo "== $l"; "$RUNNER_TEMP/audit/bin/cargo-audit" audit -f "$l"; n=$((n+1))
          done
          echo "$n locks audited"
          test "$n" -gt 0

      - name: "Control: a lock with a known advisory fails the audit"
        run: |
          set +e
          set -uo pipefail
          d=$(mktemp -d); cp scripts/fixtures/lock-controls/vulnerable-lock.toml "$d/Cargo.lock"
          if "$RUNNER_TEMP/audit/bin/cargo-audit" audit -f "$d/Cargo.lock"; then
            echo "control FAILED: audit passed a lock with tar 0.4.44"; exit 1
          fi
          echo "control ok: audit refused the planted lock"

      - name: "Control: a manifest edited past its lock is refused"
        run: |
          # GitHub runs steps with bash -e; the planted failure must not end the step
          set +e
          set -uo pipefail
          d=$(mktemp -d); cp -R tools/seam-check/. "$d/"
          printf '\n[target.%s.dependencies]\nplanted_control = { package = "once_cell", version = "=1.19.0" }\n' "'cfg(any())'" >> "$d/Cargo.toml"
          out=$(cargo metadata --locked --format-version 1 --manifest-path "$d/Cargo.toml" 2>&1 >/dev/null); rc=$?
          if [ "$rc" -eq 0 ]; then echo "control FAILED: --locked accepted a stale lock"; exit 1; fi
          # the refusal must be the lock check, not a TOML or network error
          echo "$out" | grep -q -- "--locked" || { echo "control FAILED for the wrong reason:"; echo "$out"; exit 1; }
          echo "control ok: --locked refused the stale lock"

  # The deploy runs on the same `light` pool as this job. This proves, before a
  # merge, that the pool can do everything the deploy needs — rather than
  # finding out on main, where a failed deploy leaves the live site stale.
  # Same toolchain and cache steps as deploy.yml, so it exercises the real path.
  deploy-tooling:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Every binary the deploy calls exists on this pool
        run: |
          set -euo pipefail
          missing=0
          for b in python3 tar ssh scp ssh-keyscan find sed curl git; do
            if command -v "$b" >/dev/null; then echo "ok   $b"; else echo "MISSING $b"; missing=1; fi
          done
          exit $missing

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache fetch-reports build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/fetch-reports/target
          key: fetch-reports-${{ hashFiles('tools/fetch-reports/Cargo.lock') }}

      - name: fetch-reports builds on the deploy pool
        run: cargo build --locked --release --manifest-path tools/fetch-reports/Cargo.toml
