name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
  # GitHub merge queue: `build` is the required context, so this workflow must
  # also run on the queue's merge_group event, or a queued PR waits on a check
  # nothing reports until the queue's timeout evicts it. Both jobs run in the
  # queue exactly as on a PR: they are cheap, and the queue commit is what
  # lands. Concurrency: head_ref is empty in a queue run and github.ref is the
  # entry's own gh-readonly-queue ref, so entries never cancel each other.
  merge_group:

jobs:
  build:
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","light"]') }}
    steps:
      # Full history: check-plugin-version-current.py finds the commit that set
      # the version with `git log -S`. On the default depth-1 checkout it found
      # the PR's own merge commit and passed vacuously (#315); it now exits 2
      # on a shallow clone, so this depth is what lets it run at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Zola is pinned BY PATH, not by PATH lookup. On self-hosted runners an
      # old zola (Tera v1) earlier on PATH shadowed the pinned one: the install
      # step printed `zola 0.23.6`, then the bare `zola build` rejected the Tera
      # v2 templates on main and ejected PR #298 from the merge queue (run
      # 40843089563; pulseengine/smithy#43). So the binary lands in a job-local
      # directory, is checked against a pinned sha256, and every call uses
      # "$ZOLA" — never a bare `zola`.
      #
      # ZOLA_SHA256 is the release asset's `digest` for
      # zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz (the release ships no
      # SHA256SUMS file), from https://github.com/getzola/zola/releases/tag/v0.23.6
      # via `gh api repos/getzola/zola/releases/tags/v0.23.6 --jq '.assets[].digest'`,
      # re-hashed locally on 2026-10-29. musl: static, so runner glibc drift
      # cannot break it, and it is the asset CI ran before this pin.
      - name: Install Zola (pinned by path and sha256)
        env:
          ZOLA_VERSION: 0.23.6
          ZOLA_SHA256: 7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zola-$ZOLA_VERSION"
          asset="zola-v$ZOLA_VERSION-x86_64-unknown-linux-musl.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/$asset"
          echo "$ZOLA_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" zola
          got=$("$dir/zola" --version)
          if [ "$got" != "zola $ZOLA_VERSION" ]; then
            echo "::error::pinned zola reports '$got', expected 'zola $ZOLA_VERSION'"
            exit 1
          fi
          echo "ZOLA=$dir/zola" >> "$GITHUB_ENV"
          echo "ZOLA_VERSION=$ZOLA_VERSION" >> "$GITHUB_ENV"

      # The V for the gates themselves. rivet is pinned to the version the
      # signed varve layer ships, not "latest", so CI and a local run agree —
      # a project that validates on one version and runs another is the same
      # shape as a gate that passes against the wrong instrument.
      # curl, not `gh`: the self-hosted runners do not have the GitHub CLI.
      # Measured the hard way — the first version of this step died on
      # `gh: command not found`, which is the same thing that made the report
      # freshness check silently examine nothing (#214). The release asset is
      # public, so no token is needed.
      - name: Install rivet
        run: |
          set -euo pipefail
          VER=v0.39.0
          ASSET="rivet-$VER-x86_64-unknown-linux-gnu.tar.gz"
          rm -rf /tmp/rivet-bin && mkdir -p /tmp/rivet-bin "$HOME/.local/bin"
          curl -fsSL --retry 3 -o /tmp/rivet.tar.gz \
            "https://github.com/pulseengine/rivet/releases/download/$VER/$ASSET"
          tar xzf /tmp/rivet.tar.gz -C /tmp/rivet-bin
          BIN=$(find /tmp/rivet-bin -type f -name rivet | head -1)
          test -n "$BIN"
          install -m 0755 "$BIN" "$HOME/.local/bin/rivet"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rivet" --version

      # The hero evidence panel (pulseengine.eu#201) is measured, not typed:
      # build-evidence.py writes data/evidence.json and the homepage renders it.
      # Measured here, before Build, so the PR build renders the real panel and
      # the generator runs against the pinned rivet the deploy also installs.
      # --require: claim-check and rivet run from this checkout, so if either
      # comes out unavailable here it is a broken generator, not a flaky
      # source. The layer tile may legitimately be stale or missing
      # on a PR (no ghcr fetch), and renders so.
      - name: Check the evidence panel's generator can still fail
        run: python3 scripts/build-evidence.py --self-test

      - name: Measure the hero evidence panel
        run: python3 scripts/build-evidence.py --require claims,rivet

      # Re-asserts the pinned binary immediately before building, and reports
      # any other zola on PATH at this point: later steps prepend to PATH (the
      # rivet install adds ~/.local/bin), so a check at install time would see
      # a clean PATH. The warning is diagnostics for pulseengine/smithy#43; the
      # build never uses PATH lookup.
      - name: Build
        run: |
          set -euo pipefail
          : "${ZOLA:?ZOLA is not set; the pinned install step did not run}"
          got=$("$ZOLA" --version)
          if [ "$got" != "zola $ZOLA_VERSION" ]; then
            echo "::error::$ZOLA reports '$got', expected 'zola $ZOLA_VERSION'"
            exit 1
          fi
          if other=$(command -v zola); then
            if [ "$other" != "$ZOLA" ]; then
              echo "::warning::another zola is on PATH and is NOT used: $other ($("$other" --version 2>&1 || true)); all on PATH: $(type -ap zola | xargs)"
            fi
          fi
          "$ZOLA" build

      # `zola build` does not validate links, and `zola check
      # --skip-external-links` only understands Zola's `@/path.md` syntax —
      # measured: it exits 0 with a deliberately dead `/docs/guide/compliance/`
      # in content/docs/_index.md. Our content uses raw absolute hrefs, so that
      # gate would be vacuous. This one is not: six dead links were live on the
      # site when it was added, four of them on the nav-linked /docs/ page.
      - name: Check internal links
        run: python3 scripts/check-internal-links.py

      # A published post must not link to a draft — CI builds without
      # --drafts, so the link is dead. The auto-publish cron flips draft
      # to false one post at a time; this gate catches forward links
      # before they reach production.
      - name: Check no links to draft posts
        run: python3 scripts/check-draft-links.py

      # The marketplace manifest is the storefront an outsider's `/plugin
      # install` reads, and nothing else validates it. Measured 2026-08-26: it
      # advertised v0.12.0 / "fourteen procedural skills" while the plugin was
      # v0.25.0 with sixteen — thirteen minor versions of silent drift. The
      # cache keys on plugin.json, so this never failed anything; it was just
      # wrong. Now it fails here.
      - name: Check the plugin marketplace manifest
        run: python3 scripts/check-plugin-manifest.py

      # The plugin attributes claims to blog posts by slug. A citation is prose,
      # not a link, so the link checker never sees it — deleting two drafts in
      # #169 left four citations pointing at files that no longer existed, and
      # nothing noticed for eleven days.
      - name: Check plugin post citations resolve
        run: python3 scripts/check-post-citations.py

      # Mermaid compiles classDef into the SVG, where outer CSS cannot reach it,
      # so light mode is done by rewriting known dark hexes at runtime. A diagram
      # using a surface colour the patcher does not know renders dark-on-dark.
      - name: Check mermaid diagrams can render in light mode
        run: python3 scripts/check-mermaid-light-mode.py

      # `claude plugin validate` checks the manifests, not skill frontmatter,
      # so nothing here looked at descriptions. Two skills sat 11 and 35 chars
      # over the 1024 limit until GitHub Copilot CLI refused to LOAD them —
      # not a warning, the skills simply were not there.
      - name: Check skill frontmatter loads in agent runtimes
        run: python3 scripts/check-skill-frontmatter.py

      # check-plugin-manifest keeps the manifests' spelled-out skill COUNT
      # honest, but only the README says what each skill DOES — and nothing
      # checked it. The roster drifted to 14 of 18 (evidence-transfer,
      # gate-potency, repo-hygiene, verify-your-own-claims: installed,
      # loadable, triggering, undocumented) and the count check could not see
      # it. Both directions, derived from disk so it needs no maintenance.
      - name: Check the README documents every installed skill
        run: python3 scripts/check-readme-skill-roster.py

      # The layer view builds its whole DOM in JavaScript, so a class the script
      # emits and the stylesheet does not define renders unstyled and nothing
      # else notices. Porting the prototype into the site produced six such
      # defects, all of which built cleanly; this gate catches each of them.
      - name: Check the layer view's classes are styled
        run: python3 scripts/check-layers-view.py

      # The host sends no Cache-Control, only ETag/Last-Modified, so a browser
      # caches heuristically and does not revalidate. A reader got the new
      # /layers HTML and JS against a main.css from days earlier and saw an
      # unstyled page. cachebust=true puts a content hash in the URL.
      - name: Check static assets are cache-busted
        run: python3 scripts/check-asset-cachebust.py

      # The plugin installs by version and the cache keys on it, so two trees
      # carrying the same version are indistinguishable to anyone who already
      # installed the first. check-plugin-manifest keeps the two manifests in
      # step with each other; they can do that while both are stale.
      - name: Check the plugin version tracks its content
        run: python3 scripts/check-plugin-version-current.py

      # --strict-empty is the point: without it a config typo that loads zero
      # artifacts reports n/a for every rule and historically 100% overall, so
      # the gate passes by examining nothing.
      - name: Check the gates' own traceability
        run: |
          rivet validate
          rivet coverage --tests --scan-paths scripts --strict-empty

      # The plugin's load-bearing claims, bound to re-derivable evidence
      # (pulseengine.eu#202). We ship the claim-verification skill and were one
      # of three repos in four not using it; this runs its own reference
      # implementation against our own ledger.
      # The checker's own logic first. set-equal and count-equals must fail on an
      # empty side and in both directions (pulseengine.eu#198); a checker only
      # ever seen to pass is indistinguishable from one that cannot fail.
      - name: Check the claim checker can still fail
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/claim-verification/claim-check.py --self-test

      - name: Check the plugin's claims still hold
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/claim-verification/claim-check.py claims.yaml

      # The friction x model harness (docs/experiments/2026-10-friction-x-model.md):
      # the loop, the argv, hidden-file isolation, the frozen harnesses and the
      # decision rules, with a stub model. No API call, no toolchain.
      - name: Check the friction x model harness
        run: python3 experiments/friction-x-model/fxm.py self-test

      # The issue-hunt backlog brake's decision table (REQ-ISSUE-CLASS-RATCHET).
      # It lives here, in `build`, because `build` is the only context branch
      # protection actually requires — a job in its own path-filtered workflow
      # cannot be made required without every unrelated PR waiting forever for a
      # status that never reports. The table needs no network, so it belongs on
      # the PR; the live tracker check is scheduled in issue-classes.yml, since
      # queue state drifts with no PR involved.
      - name: Check the backlog brake can still fail
        run: python3 scripts/check-issue-classes.py --self-test

      # The monthly factory report's instrument gate (REQ-FACTORY-REPORT-
      # INSTRUMENT-GATE). The report job is scheduled and needs a secret, so its
      # gating logic would otherwise only ever be exercised once a month, by a
      # paid run. Here, on every PR: low precision or recall fails, nothing is
      # written on a failure, and a missing key skips with exit 0. Offline; the
      # SDK request-shape cases skip without the SDK and run in the job itself.
      - name: Check the factory report's instrument gate can still fail
        run: python3 scripts/factory-report.py --self-test

      # The factory notice inbox's answer-safety rules (REQ-FACTORY-NOTICE-
      # ANSWER-SAFETY). An answer is an instruction and a row in warte is not
      # proof the owner wrote it, so the rejection cases (option not offered, stale revision,
      # second answer, unknown id, forged warte notice) run on every PR. Offline:
      # the warte client runs against an in-process stub on the loopback.
      - name: Check the factory notice inbox rejects unsafe answers
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/factory-notice/notice.py --self-test

      # The seam-contract checker (REQ-SEAM-CONTRACT-CHECK). Offline: one
      # negative control per rule must exit 1 with that rule named, API
      # failures must exit 2 (the real curl and urllib paths run against a
      # loopback stub, comment pagination included), and the pilot run checks
      # the four drafted drone-seam blocks against relay and jess files fetched
      # on 2026-10-29, where relay#589's block still names @0.11.0 and must go
      # red. The live check against GitHub is seam-check.yml, not a PR check.
      - name: Check the seam-contract checker can still fail
        run: |
          set -euo pipefail
          S=claude-tooling/plugins/pulseengine-claude/skills/seam-contract/seam-check.py
          python3 "$S" --self-test
          rc=0
          python3 "$S" --fixtures tests/seam-contract/pilot --now 2026-10-29 --format json \
            > "$RUNNER_TEMP/pilot.json" || rc=$?
          python3 - "$RUNNER_TEMP/pilot.json" "$rc" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          failing = {s["id"]: sorted({v["rule"] for v in s["violations"]}) for s in r["seams"] if s["violations"]}
          want = {"relay-jess/estimator-identity": ["interface-version"]}
          ok = sys.argv[2] == "1" and len(r["seams"]) == 4 and failing == want
          print("pilot: exit %s, %d seams, failing %s" % (sys.argv[2], len(r["seams"]), failing))
          sys.exit(0 if ok else 1)
          PY

      # The SessionStart hook that writes `setopt no_nomatch no_equals` into
      # $CLAUDE_ENV_FILE (REQ-HOOK-ZSH-SHELL-OPTIONS). Runs the real hook and the
      # real zsh: plain zsh must still fail `echo ===` and an unmatched glob
      # (else the check is vacuous), zsh after the file must not, the line is
      # written once, and bash sourcing it is a no-op. The test exits 2 without
      # zsh rather than skip, so a runner without it goes red, not green.
      # The self-hosted runners have no zsh and no sudo, so it is unpacked from
      # the distribution's own signed package into $RUNNER_TEMP (apt-get
      # download + dpkg -x need no root); `zsh -f` needs only the binary.
      - name: Check the zsh shell-options hook
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null; then
            d="$RUNNER_TEMP/zsh-pkg"
            mkdir -p "$d"
            ( cd "$d" && apt-get download zsh >/dev/null 2>&1 ) \
              || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq zsh; } >/dev/null 2>&1 \
              || { echo "::error::zsh is not installed and could not be fetched"; exit 2; }
            if ls "$d"/zsh_*.deb >/dev/null 2>&1; then
              dpkg -x "$d"/zsh_*.deb "$d/root"
              bin=$(find "$d/root" -type f -name 'zsh*' -perm -u+x -path '*/bin/*' | head -n 1)
              mkdir -p "$d/bin"
              ln -sf "$bin" "$d/bin/zsh"
              export PATH="$d/bin:$PATH"
            fi
          fi
          python3 scripts/check-hook-shell-options.py

      # The PreToolUse(Agent) hook that reminds the agent to choose `model:`
      # (REQ-AGENT-MODEL-REMINDER). Runs the real wrapper: it must fire on an
      # Agent call that would inherit the parent's model, stay silent on every
      # other case (model set, fork, Explore, plugin agents, bad input), and
      # never print anything but additionalContext or exit non-zero, so it can
      # never deny, approve or rewrite a call.
      - name: Check the Agent model-reminder hook never blocks
        run: |
          set -euo pipefail
          python3 scripts/check-agent-model-reminder.py

      # External review of #232 found a compiled .pyc in that PR and a second
      # one tracked for longer, with all ten gates green over both: each asked
      # whether a claim matched the tree, none asked what was in it.
      - name: Check no build artifact is tracked
        run: python3 scripts/check-no-build-artifacts.py

      # Committed scripts get run on macOS, where /bin/bash is 3.2 and
      # /usr/bin/python3 is 3.9, while every step above runs newer tools — so
      # nothing caught a script that only works on those (REQ-SCRIPT-
      # PORTABILITY). Last in the job, and setup-python with
      # update-environment: false, so no step above runs on 3.9 by accident.
      # shellcheck is pinned like zola: sha256-checked into $RUNNER_TEMP and
      # called only as "$SHELLCHECK". SHELLCHECK_SHA256 is the release asset's
      # `digest` for shellcheck-v0.11.0.linux.x86_64.tar.gz from
      # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0, re-hashed
      # locally on 2026-10-29. .tar.gz, not .tar.xz: no xz needed.
      - name: Install shellcheck (pinned by path and sha256)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          asset="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$asset"
          echo "$SHELLCHECK_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          got=$("$dir/shellcheck" --version | sed -n 's/^version: //p')
          if [ "$got" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::pinned shellcheck reports '$got', expected '$SHELLCHECK_VERSION'"
            exit 1
          fi
          echo "SHELLCHECK=$dir/shellcheck" >> "$GITHUB_ENV"

      # Severity warning and up; info-level findings (SC2086 …) are not gated.
      - name: Check tracked shell scripts with shellcheck
        run: |
          set -euo pipefail
          : "${SHELLCHECK:?SHELLCHECK is not set; the pinned install step did not run}"
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r "$SHELLCHECK" -S warning

      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          update-environment: false

      # Under 3.9 the compile step is the real 3.9 parser; the AST pass catches
      # what parses on 3.9 but fails when it runs (unguarded tomllib, `X | None`
      # annotations without `from __future__ import annotations`, …). The
      # self-test first: a checker only ever seen to pass could not fail.
      - name: Check tracked Python runs on the 3.9 floor
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
        # update-environment: false also leaves LD_LIBRARY_PATH unset, and the
        # toolcache interpreter is linked against its own libpython: without
        # this it exits 127 ("libpython3.9.so.1.0: cannot open shared object
        # file"), measured on the light pool.
        run: |
          set -euo pipefail
          pylib="$(dirname "$(dirname "$PY39")")/lib"
          export LD_LIBRARY_PATH="$pylib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$PY39" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          "$PY39" scripts/check-py-floor.py --self-test
          git ls-files -z '*.py' | xargs -0 -r "$PY39" scripts/check-py-floor.py

  # The deploy runs on the same `light` pool as this job. This proves, before a
  # merge, that the pool can do everything the deploy needs — rather than
  # finding out on main, where a failed deploy leaves the live site stale.
  # Same toolchain and cache steps as deploy.yml, so it exercises the real path.
  deploy-tooling:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","light"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Every binary the deploy calls exists on this pool
        run: |
          set -euo pipefail
          missing=0
          for b in python3 tar ssh scp ssh-keyscan find sed curl git; do
            if command -v "$b" >/dev/null; then echo "ok   $b"; else echo "MISSING $b"; missing=1; fi
          done
          exit $missing

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache fetch-reports build
        uses: actions/cache@v6
        with:
          path: tools/fetch-reports/target
          key: fetch-reports-${{ hashFiles('tools/fetch-reports/Cargo.lock') }}

      - name: fetch-reports builds on the deploy pool
        run: cargo build --release --manifest-path tools/fetch-reports/Cargo.toml
