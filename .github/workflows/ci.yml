name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v7

      - name: Install Zola
        uses: taiki-e/install-action@v2.87.21
        with:
          tool: zola@0.22.1

      - name: Build
        run: zola build

      # `zola build` does not validate links, and `zola check
      # --skip-external-links` only understands Zola's `@/path.md` syntax —
      # measured: it exits 0 with a deliberately dead `/docs/guide/compliance/`
      # in content/docs/_index.md. Our content uses raw absolute hrefs, so that
      # gate would be vacuous. This one is not: six dead links were live on the
      # site when it was added, four of them on the nav-linked /docs/ page.
      - name: Check internal links
        run: python3 scripts/check-internal-links.py

      # The marketplace manifest is the storefront an outsider's `/plugin
      # install` reads, and nothing else validates it. Measured 2026-08-26: it
      # advertised v0.12.0 / "fourteen procedural skills" while the plugin was
      # v0.25.0 with sixteen — thirteen minor versions of silent drift. The
      # cache keys on plugin.json, so this never failed anything; it was just
      # wrong. Now it fails here.
      - name: Check the plugin marketplace manifest
        run: python3 scripts/check-plugin-manifest.py

      # The plugin attributes claims to blog posts by slug. A citation is prose,
      # not a link, so the link checker never sees it — deleting two drafts in
      # #169 left four citations pointing at files that no longer existed, and
      # nothing noticed for eleven days.
      - name: Check plugin post citations resolve
        run: python3 scripts/check-post-citations.py

      # Mermaid compiles classDef into the SVG, where outer CSS cannot reach it,
      # so light mode is done by rewriting known dark hexes at runtime. A diagram
      # using a surface colour the patcher does not know renders dark-on-dark.
      - name: Check mermaid diagrams can render in light mode
        run: python3 scripts/check-mermaid-light-mode.py

      # `claude plugin validate` checks the manifests, not skill frontmatter,
      # so nothing here looked at descriptions. Two skills sat 11 and 35 chars
      # over the 1024 limit until GitHub Copilot CLI refused to LOAD them —
      # not a warning, the skills simply were not there.
      - name: Check skill frontmatter loads in agent runtimes
        run: python3 scripts/check-skill-frontmatter.py

      # The layer view builds its whole DOM in JavaScript, so a class the script
      # emits and the stylesheet does not define renders unstyled and nothing
      # else notices. Porting the prototype into the site produced six such
      # defects, all of which built cleanly; this gate catches each of them.
      - name: Check the layer view's classes are styled
        run: python3 scripts/check-layers-view.py

      # The host sends no Cache-Control, only ETag/Last-Modified, so a browser
      # caches heuristically and does not revalidate. A reader got the new
      # /layers HTML and JS against a main.css from days earlier and saw an
      # unstyled page. cachebust=true puts a content hash in the URL.
      - name: Check static assets are cache-busted
        run: python3 scripts/check-asset-cachebust.py

      # The plugin's load-bearing claims, bound to re-derivable evidence
      # (pulseengine.eu#202). We ship the claim-verification skill and were one
      # of three repos in four not using it; this runs its own reference
      # implementation against our own ledger.
      - name: Check the plugin's claims still hold
        run: python3 claude-tooling/plugins/pulseengine-claude/skills/claim-verification/claim-check.py claims.yaml
