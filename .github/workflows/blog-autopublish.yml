name: Blog auto-publish

# Runs daily at 06:00 UTC. Scans content/blog/ for drafts; for any
# post with `date <= today`, `draft = true`, and `hold` not set, it
# opens an auto-merge PR that flips draft to false. Each publish
# becomes its own PR/squash-merge so deploy fires per-post and the
# audit trail is clean.
#
# Always posts a status report to a pinned issue (label
# `autopublish-status`) using a bot-marker (`<!-- blog-cron-status -->`)
# so the same comment is replaced each run instead of appended.
#
# Failure path opens a separate issue tagged `autopublish-failure`.
#
# Manual trigger via workflow_dispatch is supported for first-run /
# debugging. Concurrency is serialized so two runs cannot interleave
# (e.g. cron + manual).
#
# Security note: this workflow has only `schedule` and
# `workflow_dispatch` triggers — neither carries untrusted user input.
# All values flowing into `run:` blocks come from server-controlled
# context (github.run_id, github.repository) or from our own script
# reading our own repository's frontmatter, so no command-injection
# surface exists from external actors.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: blog-autopublish
  cancel-in-progress: false

jobs:
  publish:
    name: Scan, publish, report
    runs-on: [self-hosted, linux, x64, light]
    timeout-minutes: 15
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPO: ${{ github.repository }}
    steps:
      # Mint a token from the PulseEngine Actions Helper App so this job
      # can `gh pr create` despite the org policy that disables PR-creation
      # for the default GITHUB_TOKEN. The App's installation grants
      # contents: write + pull-requests: write + metadata: read on this
      # repo only — strictly narrower than what GITHUB_TOKEN would have
      # had with the org permission flipped.
      - name: Mint App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The smithy self-hosted runners (migrated in #51) don't ship the gh
      # CLI — only GitHub-hosted images do — so every gh call below failed
      # with "command not found" (exit 127), breaking this cron daily.
      # Drop a pinned gh binary into a user-writable dir, the same no-sudo
      # pattern used for Zola via taiki-e/install-action. The durable fix is
      # baking gh into the runner image; this is the repo-level remedy.
      - name: Install gh CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already on PATH: $(gh --version | head -1)"
            exit 0
          fi
          GH_VERSION=2.62.0
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o gh.tar.gz
          tar -xzf gh.tar.gz
          echo "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin/gh" --version

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          # `gh label create --force` upserts (creates or updates), so this
          # step is idempotent and immune to a label being deleted manually.
          gh label create autopublish         --color 6c8cff --description "Auto-publish PR opened by the daily cron" --force
          gh label create autopublish-status  --color 22d3ee --description "Pinned status issue for the auto-publish cron" --force
          gh label create autopublish-failure --color f87171 --description "Auto-publish workflow failed on this run" --force

      - name: Scan drafts
        id: scan
        run: |
          set -euo pipefail
          python3 scripts/blog-autopublish.py --mode scan > /tmp/inventory.json
          ready_count=$(jq '.ready | length' /tmp/inventory.json)
          scheduled_count=$(jq '.scheduled | length' /tmp/inventory.json)
          held_count=$(jq '.held | length' /tmp/inventory.json)
          echo "ready_count=${ready_count}" >> "$GITHUB_OUTPUT"
          echo "scheduled_count=${scheduled_count}" >> "$GITHUB_OUTPUT"
          echo "held_count=${held_count}" >> "$GITHUB_OUTPUT"
          {
            echo "## Inventory"
            echo '```json'
            cat /tmp/inventory.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish ready posts
        id: publish
        if: steps.scan.outputs.ready_count != '0'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          published='[]'
          stuck='[]'
          today=$(date -u +%Y-%m-%d)

          # Iterate each ready post, one PR per post.
          while IFS=$'\t' read -r path slug; do
            branch="cron/publish-${slug}-${today}"

            # Clear any stale branch from a previous failed run.
            git branch -D "$branch" 2>/dev/null || true
            git push origin --delete "$branch" 2>/dev/null || true

            git checkout -b "$branch"
            python3 scripts/blog-autopublish.py --mode flip --file "$path"
            git add "$path"
            git commit -m "publish: ${slug}"
            git push -u origin "$branch"

            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "publish: ${slug}" \
              --body "Automated publish for \`${slug}\` triggered by date \`${today}\`. Opened by the blog-autopublish workflow." \
              --label autopublish)
            pr_num=$(echo "$pr_url" | grep -oE '[0-9]+$')

            # Merge, then VERIFY the outcome — do NOT trust the merge
            # command's exit code. Arming --auto returns 0 even when the PR
            # stays BLOCKED, which previously reported a stuck PR as success
            # and left the post unpublished while the run went green.
            #
            # With the pulseengine-actions-helper ruleset bypass in place the
            # direct squash merge succeeds outright; --auto stays a genuine
            # fallback for a future repo that adds required status checks.
            gh pr merge "$pr_num" --squash --delete-branch \
              || gh pr merge "$pr_num" --auto --squash --delete-branch \
              || true

            state=$(gh pr view "$pr_num" --json state --jq '.state')
            auto=$(gh pr view "$pr_num" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$state" = "MERGED" ]; then
              published=$(echo "$published" | jq --arg s "$slug" --arg p "$pr_num" '. + [{slug: $s, pr: $p}]')
            elif [ "$auto" = "true" ]; then
              echo "::warning::PR #${pr_num} (${slug}) not merged yet — auto-merge is armed; it will land once required checks pass."
            else
              echo "::error::PR #${pr_num} (${slug}) did not merge (state=${state}, auto-merge not armed). Branch protection is likely blocking the pulseengine-actions-helper app — check the repo ruleset bypass."
              stuck=$(echo "$stuck" | jq --arg s "$slug" --arg p "$pr_num" '. + [{slug: $s, pr: $p}]')
            fi

            git checkout main
            git pull --ff-only origin main
          done < <(jq -r '.ready[] | [.path, .slug] | @tsv' /tmp/inventory.json)

          echo "$published" > /tmp/published.json

          # Fail the run if any ready post opened a PR but did not actually
          # merge, so the failure issue opens instead of the run going green
          # with posts left stuck as open PRs.
          if [ "$(echo "$stuck" | jq 'length')" -gt 0 ]; then
            echo "::error::Stuck (opened but not merged): $(echo "$stuck" | jq -c '[.[].slug]')"
            exit 1
          fi

      - name: Render status report
        if: always()
        run: |
          set -euo pipefail
          published=$(cat /tmp/published.json 2>/dev/null || echo '[]')
          python3 scripts/blog-autopublish.py \
            --mode report \
            --inventory /tmp/inventory.json \
            --published "$published" \
            --run-url "$RUN_URL" > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update status comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail

          # Locate the pinned status issue by label, or create it on first run.
          issue_num=$(gh issue list --label autopublish-status --state open --json number --jq '.[0].number // empty')
          if [ -z "$issue_num" ]; then
            issue_url=$(gh issue create \
              --title "Blog auto-publish status" \
              --label autopublish-status \
              --body-file /tmp/report.md)
            issue_num=$(echo "$issue_url" | grep -oE '[0-9]+$')
            echo "Created status issue #${issue_num}"
            exit 0
          fi

          # Find the previous bot comment by its hidden marker.
          comment_id=$(gh api "repos/${REPO}/issues/${issue_num}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- blog-cron-status -->")) | .id' | head -1)

          if [ -n "$comment_id" ]; then
            gh api "repos/${REPO}/issues/comments/${comment_id}" \
              -X PATCH \
              --field body=@/tmp/report.md
            echo "Updated comment ${comment_id} on issue #${issue_num}"
          else
            gh issue comment "$issue_num" --body-file /tmp/report.md
            echo "Created new comment on issue #${issue_num}"
          fi

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          gh issue create \
            --title "blog-autopublish failed: ${today}" \
            --label autopublish-failure \
            --body "The daily blog-autopublish workflow failed on ${today}. Logs: ${RUN_URL}"
