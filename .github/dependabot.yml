# Dependabot — keep vendored deps current and surface CVE alerts.
#
# We self-host mermaid (static/mermaid.min.js) and Playwright (testing only).
# By declaring mermaid as an npm devDependency we let GitHub's vulnerability
# scanner watch it: any published advisory triggers a Dependabot security PR.
#
# Version-update flow when a Dependabot PR appears:
#   1. Pull the PR branch
#   2. `npm install`
#   3. `npm run vendor:mermaid`   (regenerates static/mermaid.min.js)
#   4. Commit the new bundle
#   5. CI watchdog (no-third-party-loads) validates the new bundle

version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21): every
# entry runs monthly (the 1st, 02:00 UTC), keeps at most 2 PRs open and waits
# 7 days after a release (cooldown). Majors stay ungrouped, one PR each.
# Security updates ignore the schedule and the limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: deps(actions)
      include: scope
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /tools/fetch-reports
      - /tools/north-star-check
      - /tools/north-star-check/harness
      - /tools/north-star-measure
      - /tools/seam-check
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: deps(cargo)
      include: scope
    groups:
      wasm-tools-family:
        patterns: ["wasmparser", "wasm-encoder", "wasmprinter", "wit-component", "wit-parser", "wasm-metadata", "wat", "walrus"]
      wasmtime:
        patterns: ["wasmtime", "wasmtime-*"]
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "autopublish"  # reuse the autopublish-style label so existing PR routing applies
    commit-message:
      prefix: deps
      include: scope
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
