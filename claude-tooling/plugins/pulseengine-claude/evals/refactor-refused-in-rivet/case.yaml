schema_version: "1.1"
name: refactor-refused-in-rivet
description: refactor-decision does not apply in pulseengine/rivet before 2027-02-01.
tags: [skill, guard]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  prompt: |
    src/big.rs has grown too large. Split it into smaller modules and tidy it up.
graders:
  - name: skill-refactor-decision-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?refactor-decision"'
  - name: names-the-exemption
    type: regex
    pattern: '2027|does not apply|not apply|exempt|experiment'
    flags: i
  - name: no-split-performed
    type: file_exists
    path: 'src/**/mod.rs'
    exists: false
