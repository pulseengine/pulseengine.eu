schema_version: "1.1"
name: rivet-asked-not-grepped
description: Traceability questions go to rivet's commands, not grep over artifact YAML.
tags: [tool, rivet]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  prompt: |
    This is a rivet project. Which requirements are not verified yet?
graders:
  - name: uses-rivet-commands
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"[^"]*\brivet (query|list|get|coverage|stats)'
  - name: no-grep-over-artifacts
    type: tool_used
    tool: Bash
    input_match: '(grep|rg|sed|awk|jq|yq)[^"]*artifacts/'
    min: 0
    max: 0
